<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Distrihuevos Bonanza</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --olive-900:#232b1f;
  --olive-700:#3a4a32;
  --pulp:#faf4e6;
  --pulp-dim:#efe6d0;
  --yolk:#e8a33d;
  --yolk-dark:#c9821f;
  --brick:#b1472e;
  --ink:#23281f;
  --ink-soft:#5c6153;
  --line:#ddd2ae;
  --ok:#4c7a4c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--olive-900);}
body{
  font-family:'Work Sans',sans-serif;
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
#root{
  max-width:480px;
  margin:0 auto;
  background:var(--pulp);
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
}
.topbar{
  background:var(--olive-900);
  color:var(--pulp);
  padding:18px 20px 16px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom:3px solid var(--yolk);
}
.topbar .brand{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:0.2px;
}
.topbar .brand small{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-weight:500;
  font-size:10px;
  letter-spacing:1.5px;
  color:var(--yolk);
  margin-top:2px;
}
.topbar .clock{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:#c9c2a4;
  text-align:right;
}
.sync-btn{
  background:none;
  border:1px solid #4a5640;
  color:var(--pulp);
  border-radius:8px;
  padding:6px 9px;
  display:flex;
  align-items:center;
  gap:5px;
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  margin-top:6px;
}
.sync-btn svg{width:13px;height:13px;}
.sync-btn.spinning svg{animation:spin 0.7s linear;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.view{
  flex:1;
  padding:16px 16px 96px;
  overflow-y:auto;
}
.hide{display:none !important;}

/* Cards */
.stat-row{display:flex;gap:10px;margin-bottom:14px;}
.stat-card{
  flex:1;
  background:var(--olive-900);
  color:var(--pulp);
  border-radius:14px;
  padding:14px 12px;
  position:relative;
  overflow:hidden;
}
.stat-card .egg{
  position:absolute;
  right:-10px;
  top:-14px;
  width:52px;
  height:64px;
  border-radius:50% 50% 46% 46%/58% 58% 42% 42%;
  background:rgba(232,163,61,0.14);
}
.stat-card .lbl{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  letter-spacing:1.2px;
  color:var(--yolk);
  text-transform:uppercase;
}
.stat-card .val{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:20px;
  margin-top:4px;
}
.stat-card .sub{font-size:10.5px;color:#b9b39a;margin-top:2px;}

.section-title{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:16px;
  margin:20px 0 10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-title .tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  background:var(--yolk);
  color:var(--olive-900);
  padding:2px 6px;
  border-radius:20px;
  font-weight:600;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:9px;
}
.prod-row{display:flex;justify-content:space-between;align-items:center;}
.prod-name{font-weight:600;font-size:14px;}
.prod-code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);}
.prod-stock{text-align:right;}
.prod-stock .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;}
.prod-stock .u{font-size:9.5px;color:var(--ink-soft);}
.low{color:var(--brick) !important;}
.wa-btn{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#25D366;
  color:#fff;
  text-decoration:none;
  padding:6px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:600;
  font-family:'Work Sans',sans-serif;
  margin-top:6px;
}
.wa-btn svg{width:13px;height:13px;fill:#fff;}
.debt-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:6px;
}
.icon-btn{
  background:none;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:13px;
  padding:4px 7px;
  line-height:1;
}
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(35,40,31,0.6);
  display:flex;align-items:center;justify-content:center;
  z-index:60;
  padding:20px;
}
.modal-box{
  background:var(--pulp);
  border-radius:16px;
  padding:20px;
  width:100%;
  max-width:360px;
  max-height:85vh;
  overflow-y:auto;
}
.modal-box h3{
  font-family:'Fraunces',serif;
  margin:0 0 4px;
  font-size:18px;
}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.btn-danger{
  flex:1;
  background:none;
  border:1.5px solid var(--brick);
  color:var(--brick);
  border-radius:12px;
  padding:13px;
  font-weight:600;
  font-family:'Work Sans',sans-serif;
}
.modal-actions .btn-main{margin-top:0;flex:1.3;}

/* Forms */
label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:0.8px;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:14px 0 6px;
}
select,input{
  width:100%;
  padding:11px 12px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:#fff;
  font-family:'Work Sans',sans-serif;
  font-size:15px;
  color:var(--ink);
}
select:focus,input:focus{outline:2px solid var(--yolk-dark);outline-offset:1px;}
.total-box{
  margin-top:16px;
  background:var(--olive-900);
  color:var(--pulp);
  border-radius:12px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.total-box .t-lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--yolk);}
.total-box .t-val{font-family:'Fraunces',serif;font-weight:700;font-size:22px;}
.btn-main{
  width:100%;
  margin-top:16px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:var(--yolk-dark);
  color:#fff;
  font-family:'Work Sans',sans-serif;
  font-weight:600;
  font-size:15px;
  letter-spacing:0.3px;
}
.btn-main:active{transform:scale(0.98);}
.toggle-row{display:flex;gap:8px;}
.toggle-opt{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:10px;
  border:1.5px solid var(--line);
  font-size:13px;
  font-weight:500;
  color:var(--ink-soft);
  background:#fff;
}
.toggle-opt.active{
  background:var(--olive-700);
  border-color:var(--olive-700);
  color:#fff;
}

/* Movements list */
.mov{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
}
.mov:last-child{border-bottom:none;}
.mov-left{display:flex;gap:10px;align-items:center;}
.mov-badge{
  width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
  color:#fff;flex-shrink:0;
}
.mov-badge.venta{background:var(--ok);}
.mov-badge.compra{background:var(--brick);}
.mov-name{font-size:13.5px;font-weight:600;}
.mov-sub{font-size:11px;color:var(--ink-soft);}
.mov-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;}

/* Bottom nav */
.navbar{
  position:sticky;
  bottom:0;
  max-width:480px;
  margin:0 auto;
  background:var(--olive-900);
  display:flex;
  border-top:1px solid #3a4632;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-btn{
  flex:1;
  background:none;
  border:none;
  color:#8b9179;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:6px 2px;
  font-family:'Work Sans',sans-serif;
  font-size:9.5px;
  border-radius:10px;
}
.nav-btn.active{color:var(--yolk);}
.nav-btn svg{width:20px;height:20px;}

/* Stamp confirmation */
.stamp-overlay{
  position:fixed;inset:0;
  background:rgba(35,40,31,0.55);
  display:flex;align-items:center;justify-content:center;
  z-index:50;
}
.stamp{
  background:var(--pulp);
  border:3px solid var(--brick);
  color:var(--brick);
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:22px;
  padding:18px 30px;
  border-radius:10px;
  transform:rotate(-6deg);
  text-align:center;
  letter-spacing:1px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
.stamp .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  margin-top:4px;
  letter-spacing:0.5px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:var(--ink-soft);
  font-size:13px;
}
.install-banner{
  background:var(--pulp-dim);
  border:1px dashed var(--yolk-dark);
  border-radius:12px;
  padding:12px 14px;
  font-size:12px;
  color:var(--ink-soft);
  margin-bottom:16px;
  line-height:1.5;
}
.install-banner b{color:var(--ink);}
.close-x{float:right;background:none;border:none;font-size:14px;color:var(--ink-soft);}
</style>
</head>

const STORAGE_KEY = 'huevos-interprice:data';
const money = n => '$' + Number(n||0).toLocaleString('es-CO');
const todayISO = () => new Date().toISOString().slice(0,10);
function waLink(tel, msg){
  let digits = (tel||'').replace(/\D/g,'');
  if(digits.length===10 && digits.startsWith('3')) digits = '57'+digits;
  return `https://wa.me/${digits}?text=${encodeURIComponent(msg)}`;
}

function hasCloudStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
function loadData(cb){
  try{
    if(hasCloudStorage()){
      window.storage.get(STORAGE_KEY, true).then(res=>{
        if(res && res.value){
          try{ cb(JSON.parse(res.value)); return; }catch(e){}
        }
        cb(JSON.parse(JSON.stringify(SEED)));
      }).catch(()=> cb(JSON.parse(JSON.stringify(SEED))));
      return;
    }
    // Fuera de Claude: usar el almacenamiento local del navegador del celular
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{ cb(JSON.parse(raw)); return; }catch(e){}
    }
    cb(JSON.parse(JSON.stringify(SEED)));
  }catch(e){
    cb(JSON.parse(JSON.stringify(SEED)));
  }
}
function saveData(data){
  try{
    if(hasCloudStorage()){
      return window.storage.set(STORAGE_KEY, JSON.stringify(data), true).catch(()=>null);
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return Promise.resolve();
  }catch(e){
    return Promise.resolve();
  }
}

// ---------- App state ----------
let DATA = null;
let TAB = 'inicio';

function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
}
function tomorrowISO(iso){
  const dt = new Date(iso+'T00:00:00');
  dt.setDate(dt.getDate()+1);
  return dt.toISOString().slice(0,10);
}

function render(){
  const root = document.getElementById('root');

// ---------- Cartera (créditos) ----------
function saldoCliente(nombre){
  const debe = DATA.ventas.filter(v=>v.cliente===nombre && v.condicion==='CREDITO').reduce((s,v)=>s+v.total,0);
  const pagado = DATA.abonos.filter(a=>a.cliente===nombre).reduce((s,a)=>s+a.valor,0);
  return debe - pagado;
}
function clientesConSaldo(){
  const nombres = [...new Set(DATA.ventas.filter(v=>v.condicion==='CREDITO').map(v=>v.cliente).filter(Boolean))];
  return nombres.map(n=>({nombre:n, saldo:saldoCliente(n)})).filter(c=>c.saldo>0).sort((a,b)=>b.saldo-a.saldo);
}
function saldoProveedor(nombre){
  const debe = DATA.compras.filter(c=>c.proveedor===nombre && c.condicion==='CREDITO').reduce((s,c)=>s+c.total,0);
  const pagado = DATA.abonosCompra.filter(a=>a.proveedor===nombre).reduce((s,a)=>s+a.valor,0);
  return debe - pagado;
}
function proveedoresConSaldo(){
  const nombres = [...new Set(DATA.compras.filter(c=>c.condicion==='CREDITO').map(c=>c.proveedor).filter(Boolean))];
  return nombres.map(n=>({nombre:n, saldo:saldoProveedor(n)})).filter(p=>p.saldo>0).sort((a,b)=>b.saldo-a.saldo);
}
function telDe(nombre, lista){
  const f = lista.find(x=>x.nombre===nombre);
  return f ? f.tel : '';
}
function viewCartera(){
  const lista = clientesConSaldo();
  const totalCartera = lista.reduce((s,c)=>s+c.saldo,0);
  const listaProv = proveedoresConSaldo();
  const totalProv = listaProv.reduce((s,p)=>s+p.saldo,0);
  return `
    <div class="stat-row">
      <div class="stat-card"><div class="egg"></div><div class="lbl">Te deben</div><div class="val">${money(totalCartera)}</div><div class="sub">${lista.length} cliente(s)</div></div>
      <div class="stat-card"><div class="egg"></div><div class="lbl">Debes</div><div class="val">${money(totalProv)}</div><div class="sub">${listaProv.length} proveedor(es)</div></div>
    </div>

    <div class="section-title">👥 Clientes que te deben <span class="tag">${lista.length}</span></div>
    ${lista.length===0 ? `<div class="empty">Nadie te debe por ahora.</div>` :
      lista.map(c=>{
        const tel = telDe(c.nombre, DATA.clientes);
        const msg = `Hola ${c.nombre}, te escribimos de Distrihuevos Bonanza. Tu saldo pendiente actual es de ${money(c.saldo)}. ¡Gracias!`;
        return `<div class="card debt-row">
          <div><div class="prod-name">${c.nombre}</div><div class="n low" style="font-size:15px">${money(c.saldo)}</div>
          ${tel ? `<a class="wa-btn" href="${waLink(tel,msg)}" target="_blank">${waIcon()} Enviar saldo</a>` : `<div class="mov-sub">Sin teléfono registrado</div>`}
          </div>
        </div>`;
      }).join('')}

    <div class="section-title">Registrar abono de cliente</div>
    <label>Cliente</label>
    <select id="ab-cliente">
      ${lista.length===0 ? `<option value="">No hay clientes con saldo</option>` :
        lista.map(c=>`<option value="${c.nombre}">${c.nombre} — debe ${money(c.saldo)}</option>`).join('')}
    </select>
    <label>Valor del abono</label>
    <input type="number" id="ab-valor" min="0" inputmode="numeric" placeholder="0">
    <button class="btn-main" id="ab-submit" ${lista.length===0?'disabled':''}>Registrar abono</button>

    <div class="section-title">🚚 Proveedores a los que debes <span class="tag">${listaProv.length}</span></div>
    ${listaProv.length===0 ? `<div class="empty">No debes a ningún proveedor por ahora.</div>` :
      listaProv.map(p=>{
        const tel = telDe(p.nombre, DATA.proveedores);
        const msg = `Hola ${p.nombre}, te escribimos de Distrihuevos Bonanza. Nuestro saldo pendiente con ustedes es de ${money(p.saldo)}.`;
        return `<div class="card debt-row">
          <div><div class="prod-name">${p.nombre}</div><div class="n low" style="font-size:15px">${money(p.saldo)}</div>
          ${tel ? `<a class="wa-btn" href="${waLink(tel,msg)}" target="_blank">${waIcon()} Enviar saldo</a>` : `<div class="mov-sub">Sin teléfono registrado</div>`}
          </div>
        </div>`;
      }).join('')}

    <div class="section-title">Registrar pago a proveedor</div>
    <label>Proveedor</label>
    <select id="abp-proveedor">
      ${listaProv.length===0 ? `<option value="">No hay proveedores con saldo</option>` :
        listaProv.map(p=>`<option value="${p.nombre}">${p.nombre} — debes ${money(p.saldo)}</option>`).join('')}
    </select>
    <label>Valor del pago</label>
    <input type="number" id="abp-valor" min="0" inputmode="numeric" placeholder="0">
    <button class="btn-main" id="abp-submit" ${listaProv.length===0?'disabled':''}>Registrar pago</button>
  `;
}
function waIcon(){
  return `<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.5 15.2L2 22l4.9-1.5A10 10 0 1012 2zm0 18.2a8.1 8.1 0 01-4.3-1.2l-.3-.2-3 1 1-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.6-6.1c-.3-.1-1.6-.8-1.8-.9s-.4-.1-.6.1-.7.9-.9 1.1-.3.2-.6.1a6.6 6.6 0 01-2-1.2 7.3 7.3 0 01-1.4-1.7c-.1-.2 0-.4.1-.5s.3-.3.4-.5a1.9 1.9 0 00.2-.4.4.4 0 000-.4c-.1-.1-.6-1.4-.8-1.9s-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 2.9 2.9 0 00-.9 2.2 5.1 5.1 0 001.1 2.7 11.6 11.6 0 004.5 4 5.1 5.1 0 003.1.6 2.6 2.6 0 001.7-1.2 2.1 2.1 0 00.1-1.2c-.1-.1-.3-.2-.6-.3z"/></svg>`;

function wireCartera(){
  const btn = document.getElementById('ab-submit');
  if(btn && !btn.disabled){
    btn.onclick = ()=>{
      const cliente = document.getElementById('ab-cliente').value;
      const valor = +document.getElementById('ab-valor').value;
      if(!valor || valor<=0) return alert('Ingresa un valor válido.');
      const saldo = saldoCliente(cliente);
      if(valor > saldo) return alert(`El abono no puede ser mayor a lo que debe (${money(saldo)}).`);
      DATA.abonos.push({id: Date.now(), fecha: todayISO(), cliente, valor});
      saveData(DATA).then(()=>{
        showStamp('ABONADO', `${cliente} · ${money(valor)}`);
        TAB='cartera'; render();
      });
    };
  }
  const btnp = document.getElementById('abp-submit');
  if(btnp && !btnp.disabled){
    btnp.onclick = ()=>{
      const proveedor = document.getElementById('abp-proveedor').value;
      const valor = +document.getElementById('abp-valor').value;
      if(!valor || valor<=0) return alert('Ingresa un valor válido.');
      const saldo = saldoProveedor(proveedor);
      if(valor > saldo) return alert(`El pago no puede ser mayor a lo que debes (${money(saldo)}).`);
      DATA.abonosCompra.push({id: Date.now(), fecha: todayISO(), proveedor, valor});
      saveData(DATA).then(()=>{
        showStamp('PAGO REGISTRADO', `${proveedor} · ${money(valor)}`);
        TAB='cartera'; render();
      });
    };
  }
}

// ---------- Caja (gastos + flujo) ----------
function cuadreDelDia(fecha){
  const base = DATA.baseCaja[fecha] || 0;
  const ventas = DATA.ventas.filter(v=>v.fecha===fecha && v.condicion==='CONTADO');
  const abonos = DATA.abonos.filter(a=>a.fecha===fecha);
  const compras = DATA.compras.filter(c=>c.fecha===fecha && c.condicion==='CONTADO');
  const pagosProv = DATA.abonosCompra.filter(a=>a.fecha===fecha);
  const gastos = DATA.gastos.filter(g=>g.fecha===fecha);
  const sum = arr => arr.reduce((s,x)=>s+(x.total??x.valor),0);
  const entra = sum(ventas) + sum(abonos);
  const sale = sum(compras) + sum(pagosProv) + sum(gastos);
  return {
    base, ventas, abonos, compras, pagosProv, gastos,
    total: base + entra - sale
  };
}
function viewCaja(){
  const ventasContado = DATA.ventas.filter(v=>v.condicion==='CONTADO').reduce((s,v)=>s+v.total,0);
  const abonosTotal = DATA.abonos.reduce((s,a)=>s+a.valor,0);
  const comprasContado = DATA.compras.filter(c=>c.condicion==='CONTADO').reduce((s,c)=>s+c.total,0);
  const abonosCompraTotal = DATA.abonosCompra.reduce((s,a)=>s+a.valor,0);
  const gastosTotal = DATA.gastos.reduce((s,g)=>s+g.valor,0);
  const ingresos = ventasContado + abonosTotal;
  const egresos = comprasContado + abonosCompraTotal + gastosTotal;
  const neto = ingresos - egresos;

function wireVender(){
  const prodSel = document.getElementById('v-prod');
  const precioInp = document.getElementById('v-precio');
  const cantInp = document.getElementById('v-cant');
  const totalEl = document.getElementById('v-total');
  let condicion = 'CONTADO';
  const tip = localStorage_fake_hide();
  if(tip) document.getElementById('installTip').classList.add('hide');
  document.getElementById('closeTip').onclick = ()=>{ document.getElementById('installTip').classList.add('hide'); window.__hideTip = true; };
  if(window.__hideTip) document.getElementById('installTip').classList.add('hide');

  function syncPrecio(){
    const p = DATA.productos.find(p=>p.codigo===prodSel.value);
    precioInp.value = p ? p.precio : 0;
    updateTotal();
  }
  function updateTotal(){
    totalEl.textContent = money((+cantInp.value||0)*(+precioInp.value||0));
  }
  prodSel.onchange = syncPrecio;
  precioInp.oninput = updateTotal;
  cantInp.oninput = updateTotal;
  document.getElementById('v-contado').onclick = ()=>{ condicion='CONTADO'; toggleUI('v-contado','v-credito'); };
  document.getElementById('v-credito').onclick = ()=>{ condicion='CREDITO'; toggleUI('v-credito','v-contado'); };
  syncPrecio();

  document.getElementById('v-submit').onclick = ()=>{
    const p = DATA.productos.find(p=>p.codigo===prodSel.value);
    const cant = +cantInp.value, precio = +precioInp.value;
    if(!cant || cant<=0) return alert('Ingresa una cantidad válida.');
    if(cant > p.stock) return alert(`Stock insuficiente. Disponible: ${p.stock} unidades.`);
    const total = cant*precio;
    const costoTotal = cant*p.costo;
    p.stock -= cant;
    DATA.ventas.push({
      id: Date.now(), fecha: todayISO(), codigo:p.codigo, nombre:p.nombre,
      cantidad:cant, precio, total, costoTotal,
      cliente: document.getElementById('v-cliente').value, condicion
    });
    saveData(DATA).then(()=>{
      showStamp('VENDIDO', `${cant} × ${p.nombre} · ${money(total)}`);
      TAB='vender'; render();
    });
  };
}
function toggleUI(onId,offId){

function wireComprar(){
  const prodSel = document.getElementById('c-prod');
  const costoInp = document.getElementById('c-costo');
  const cantInp = document.getElementById('c-cant');
  const totalEl = document.getElementById('c-total');
  let condicion = 'CONTADO';
  function syncCosto(){
    const p = DATA.productos.find(p=>p.codigo===prodSel.value);
    costoInp.value = p ? p.costo : 0;
    updateTotal();
  }
  function updateTotal(){
    totalEl.textContent = money((+cantInp.value||0)*(+costoInp.value||0));
  }
  prodSel.onchange = syncCosto;
  costoInp.oninput = updateTotal;
  cantInp.oninput = updateTotal;
  document.getElementById('c-contado').onclick = ()=>{ condicion='CONTADO'; toggleUI('c-contado','c-credito'); };
  document.getElementById('c-credito').onclick = ()=>{ condicion='CREDITO'; toggleUI('c-credito','c-contado'); };

    if(!cant || cant<=0) return alert('Ingresa una cantidad válida.');

    p.costo = costo; // actualiza costo de referencia
    const total = cant*costo;
    DATA.compras.push({
      id: Date.now(), fecha: todayISO(), codigo:p.codigo, nombre:p.nombre,
      cantidad:cant, costo, total,
      proveedor: document.getElementById('c-prov').value, condicion,
      vencimiento: document.getElementById('c-venc').value || null
    });
    saveData(DATA).then(()=>{
      showStamp('COMPRADO', `${cant} × ${p.nombre} · ${money(total)}`);
      TAB='comprar'; render();
    });
  };
}

function viewMovs(){
  const all = [
    ...DATA.ventas.map(v=>({...v,tipo:'venta'})),
    ...DATA.compras.map(c=>({...c,tipo:'compra'})),
  ].sort((a,b)=> b.id - a.id);
  return `
    <div class="section-title">Historial completo <span class="tag">${all.length}</span></div>
    ${all.length===0 ? `<div class="empty">Aún no hay movimientos.</div>` : `<div class="card">${all.map(movRow).join('')}</div>`}
  `;
}

function showStamp(text, sub){
  const ov = document.createElement('div');
  ov.className = 'stamp-overlay';
  ov.innerHTML = `<div class="stamp">${text}<div class="sub">${sub}</div></div>`;
  document.body.appendChild(ov);
  setTimeout(()=> ov.remove(), 1100);
}

// ---------- Edición y eliminación ----------
function showModal(innerHtml){
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modalOverlay';
  ov.innerHTML = `<div class="modal-box">${innerHtml}</div>`;
  ov.onclick = (e)=>{ if(e.target===ov) closeModal(); };
  document.body.appendChild(ov);
}
function closeModal(){
  const el = document.getElementById('modalOverlay');
  if(el) el.remove();
}
function wireEditButtons(){
  document.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick = ()=>{
      const tipo = b.dataset.edit, id = b.dataset.id;
      if(tipo==='venta') openEditVenta(id);
      else if(tipo==='compra') openEditCompra(id);
      else if(tipo==='abono') openEditAbono(id);
      else if(tipo==='pago') openEditPago(id);
      else if(tipo==='gasto') openEditGasto(id);
    };
  });
}

function openEditVenta(id){
  const v = DATA.ventas.find(x=>x.id===Number(id));
  if(!v) return;
  showModal(`
    <h3>Editar venta</h3>
    <div style="color:var(--ink-soft);font-size:13px;margin-bottom:8px">${v.nombre} · ${fmtDate(v.fecha)}</div>
    <label style="margin-top:0">Cantidad</label><input type="number" id="em-cant" min="1" value="${v.cantidad}">
    <label>Precio unitario</label><input type="number" id="em-precio" min="0" value="${v.precio}">
    <label>Condición</label>
    <select id="em-cond">
      <option value="CONTADO" ${v.condicion==='CONTADO'?'selected':''}>Contado</option>
      <option value="CREDITO" ${v.condicion==='CREDITO'?'selected':''}>Crédito</option>
    </select>
    <div class="modal-actions">
      <button class="btn-danger" id="em-del">Eliminar</button>
      <button class="btn-main" id="em-save">Guardar</button>
    </div>
  `);
  document.getElementById('em-save').onclick = ()=>{
    const nuevaCant = +document.getElementById('em-cant').value;
    const nuevoPrecio = +document.getElementById('em-precio').value;
    const nuevaCond = document.getElementById('em-cond').value;
    if(!nuevaCant || nuevaCant<=0) return alert('Cantidad inválida.');
    const p = DATA.productos.find(pr=>pr.codigo===v.codigo);
    const costoUnit = v.cantidad ? v.costoTotal/v.cantidad : (p?p.costo:0);
    const diff = nuevaCant - v.cantidad;
    if(p){
      if(diff > 0 && diff > p.stock) return alert(`No hay suficiente stock para aumentar la cantidad. Disponible: ${p.stock}.`);
      p.stock -= diff;
    }
    v.cantidad = nuevaCant; v.precio = nuevoPrecio;
    v.total = nuevaCant*nuevoPrecio; v.costoTotal = nuevaCant*costoUnit;
    v.condicion = nuevaCond;
    saveData(DATA).then(()=>{ closeModal(); showStamp('VENTA EDITADA', v.nombre); render(); });
  };
  document.getElementById('em-del').onclick = ()=>{
    if(!confirm('¿Eliminar esta venta? El stock se devuelve al inventario.')) return;
    const p = DATA.productos.find(pr=>pr.codigo===v.codigo);
    if(p) p.stock += v.cantidad;
    DATA.ventas = DATA.ventas.filter(x=>x.id!==v.id);
    saveData(DATA).then(()=>{ closeModal(); showStamp('VENTA ELIMINADA', v.nombre); render(); });
  };
}

function openEditCompra(id){
  const c = DATA.compras.find(x=>x.id===Number(id));
  if(!c) return;
  showModal(`
    <h3>Editar compra</h3>
    <div style="color:var(--ink-soft);font-size:13px;margin-bottom:8px">${c.nombre} · ${fmtDate(c.fecha)}</div>
    <label style="margin-top:0">Cantidad</label><input type="number" id="em-cant" min="1" value="${c.cantidad}">
    <label>Costo unitario</label><input type="number" id="em-costo" min="0" value="${c.costo}">
    <label>Condición</label>
    <select id="em-cond">
      <option value="CONTADO" ${c.condicion==='CONTADO'?'selected':''}>Contado</option>
      <option value="CREDITO" ${c.condicion==='CREDITO'?'selected':''}>Crédito</option>
    </select>
    <label>Fecha de vencimiento del lote</label>
    <input type="date" id="em-venc" value="${c.vencimiento||''}">
    <div class="modal-actions">
      <button class="btn-danger" id="em-del">Eliminar</button>
      <button class="btn-main" id="em-save">Guardar</button>
    </div>
  `);
  document.getElementById('em-save').onclick = ()=>{
    const nuevaCant = +document.getElementById('em-cant').value;
    const nuevoCosto = +document.getElementById('em-costo').value;
    const nuevaCond = document.getElementById('em-cond').value;
    const nuevaVenc = document.getElementById('em-venc').value || null;
    if(!nuevaCant || nuevaCant<=0) return alert('Cantidad inválida.');
    const p = DATA.productos.find(pr=>pr.codigo===c.codigo);
    const diff = nuevaCant - c.cantidad;
    if(p) p.stock += diff;
    c.cantidad = nuevaCant; c.costo = nuevoCosto;
    c.total = nuevaCant*nuevoCosto; c.condicion = nuevaCond; c.vencimiento = nuevaVenc;
    saveData(DATA).then(()=>{ closeModal(); showStamp('COMPRA EDITADA', c.nombre); render(); });
  };
  document.getElementById('em-del').onclick = ()=>{
    if(!confirm('¿Eliminar esta compra? Se descuenta del inventario.')) return;
    const p = DATA.productos.find(pr=>pr.codigo===c.codigo);
    if(p) p.stock -= c.cantidad;
    DATA.compras = DATA.compras.filter(x=>x.id!==c.id);
    saveData(DATA).then(()=>{ closeModal(); showStamp('COMPRA ELIMINADA', c.nombre); render(); });
  };
}

function openEditGasto(id){
  const g = DATA.gastos.find(x=>x.id===Number(id));
  if(!g) return;
  showModal(`
    <h3>Editar gasto</h3>
    <label style="margin-top:0">Concepto</label><input type="text" id="em-concepto" value="${g.concepto}">
    <label>Valor</label><input type="number" id="em-valor" min="0" value="${g.valor}">
    <div class="modal-actions">
      <button class="btn-danger" id="em-del">Eliminar</button>
      <button class="btn-main" id="em-save">Guardar</button>
    </div>
  `);
  document.getElementById('em-save').onclick = ()=>{
    const concepto = document.getElementById('em-concepto').value.trim();
    const valor = +document.getElementById('em-valor').value;
    if(!concepto) return alert('Escribe el concepto.');
    if(!valor || valor<=0) return alert('Valor inválido.');
    g.concepto = concepto; g.valor = valor;
    saveData(DATA).then(()=>{ closeModal(); showStamp('GASTO EDITADO', concepto); render(); });
  };
  document.getElementById('em-del').onclick = ()=>{
    if(!confirm('¿Eliminar este gasto?')) return;
    DATA.gastos = DATA.gastos.filter(x=>x.id!==g.id);
    saveData(DATA).then(()=>{ closeModal(); showStamp('GASTO ELIMINADO', g.concepto); render(); });
  };
}

// ---------- Boot ----------
try{
  loadData(data=>{
    DATA = data;
    render();
  });
}catch(e){
  DATA = JSON.parse(JSON.stringify(SEED));
  render();
}
window.addEventListener('error', function(){
  if(!DATA){ DATA = JSON.parse(JSON.stringify(SEED)); render(); }
});
</script>
