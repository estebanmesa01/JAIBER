<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#232b1f"><title>DistriHuevos Bonanza</title>
<style>
:root{--bg:#f7f1df;--dark:#232b1f;--olive:#3a4a32;--gold:#e8a33d;--red:#b1472e;--green:#4c7a4c;--ink:#23281f;--muted:#6b6d60;--line:#ddd2ae;--white:#fffdf6}*{box-sizing:border-box}body{margin:0;background:var(--dark);font-family:Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;background:var(--bg);min-height:100vh}.top{background:var(--dark);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:20}.brand{font-size:21px;font-weight:800}.brand small{display:block;color:var(--gold);font-size:10px;letter-spacing:1.4px;margin-top:3px}.clock{font-size:12px;color:#ddd}.toolbar{padding:10px 14px;background:#fff8e8;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:69px;z-index:19}.btn{border:1px solid var(--olive);background:var(--olive);color:white;border-radius:8px;padding:9px 12px}.btn.alt{background:white;color:var(--olive)}.btn.danger{background:var(--red);border-color:var(--red)}.nav{display:flex;overflow:auto;gap:6px;padding:10px 14px;background:#eee5cc;border-bottom:1px solid var(--line)}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff8e8;border-radius:999px;padding:8px 11px}.nav button.active{background:var(--olive);color:#fff}.content{padding:16px}.title{font-size:22px;font-weight:800;margin:5px 0 4px}.sub{color:var(--muted);margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px}.metric b{display:block;font-size:20px;margin-top:5px}.metric span{font-size:12px;color:var(--muted)}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cfc6a9;border-radius:8px;background:white}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:10px}.tbl{border-collapse:collapse;width:100%;min-width:760px}.tbl th,.tbl td{border-bottom:1px solid #eee4ca;padding:8px;text-align:left;font-size:12px;white-space:nowrap}.tbl th{background:#eee5cc;position:sticky;top:0;z-index:1}.empty{padding:25px;text-align:center;color:var(--muted)}.badge{padding:3px 7px;border-radius:99px;font-size:11px;background:#eee}.ok{color:var(--green);font-weight:700}.warn{color:#9b6a00;font-weight:700}.bad{color:var(--red);font-weight:700}.invoice{background:#fff;border:1px solid var(--line);padding:20px;border-radius:12px}.invoice h2{margin:0}.invoicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.modal.show{display:flex}.modalbox{background:var(--bg);max-width:850px;width:100%;max-height:92vh;overflow:auto;border-radius:14px;padding:18px}.close{float:right;border:0;background:none;font-size:22px}.toast{position:fixed;right:15px;bottom:15px;background:var(--dark);color:#fff;padding:11px 14px;border-radius:9px;display:none;z-index:100}.toast.show{display:block}.hint{font-size:12px;color:var(--muted)}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}.top{position:static}.toolbar{position:static}.nav{position:sticky;top:0;z-index:15}}@media(max-width:520px){.cards,.form{grid-template-columns:1fr}.content{padding:10px}.top{padding:13px}.brand{font-size:18px}}

.summary-list{display:flex;flex-direction:column;gap:0;margin-top:8px}
.summary-list>div{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.08)}
.summary-list>div:last-child{border-bottom:0}
.summary-list span{font-size:14px}
.summary-list b{font-size:15px}
.flow-row{padding:12px 0;border-bottom:1px solid rgba(0,0,0,.08)}
.flow-row:last-child{border-bottom:0}
.flow-row small{display:block;opacity:.65;margin-top:3px}
.flow-values{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.flow-values span{background:rgba(0,0,0,.035);border-radius:10px;padding:8px;font-size:12px}
.flow-values b{font-size:13px}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);padding:18px}
.auth-box{background:var(--bg);width:100%;max-width:400px;border-radius:16px;padding:26px 24px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.auth-logo{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:16px}
.auth-logo img{height:64px;width:64px;border-radius:50%;object-fit:cover;background:#fff;margin-bottom:8px}
.auth-logo b{font-size:18px}
.auth-logo small{color:var(--muted);letter-spacing:1px;font-size:10px}
.auth-title{font-size:17px;font-weight:800;margin:4px 0 14px;text-align:center}
.auth-field{margin-bottom:12px}
.auth-field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.auth-field input{width:100%;padding:10px;border:1px solid #cfc6a9;border-radius:8px;background:white}
.auth-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.auth-link{background:none;border:0;color:var(--olive);font-size:12px;text-decoration:underline;padding:4px;text-align:center}
.auth-error{background:#fbe4dc;color:var(--red);border:1px solid #e8b8a8;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.auth-ok{background:#e5f0e5;color:var(--green);border:1px solid #bcd8bc;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.auth-hint{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5}

// Corrige en datos ya guardados las fórmulas viejas que dependían de "Tablas" de Excel
// que el exportador no incluye, y que por eso salían en error (#VALUE!/#N/A) al abrir
// el archivo exportado. Se reemplazan por fórmulas de rango equivalentes.
function fixLegacyFormulas(){
  const fix=(sheet,rowIdx,colIdx,oldFrag,newVal)=>{
    const rows=DB[sheet]; if(!rows||!rows[rowIdx]) return;
    const cell=rows[rowIdx][colIdx];
    if(typeof cell==='string' && cell.includes(oldFrag)) rows[rowIdx][colIdx]=newVal;
  };
  fix('GASTOS',1,3,'Tabla21','=SUM(E4:E100000)');
  fix('INVENTARIO',2,7,'INVENTARIO[','=SUBTOTAL(9,G5:G100000)');
  fix('COMPRAS',2,7,'COMPRAS[','=SUBTOTAL(9,H5:H100000)');
  fix('VENTAS',2,8,'VENTAS[','=SUBTOTAL(9,I5:I100000)');
  fix('VENTAS',2,9,'VENTAS[','=SUBTOTAL(9,J5:J100000)');
  fix('FACTURAS & ABONOS VENTAS',1,8,'FACTURA[','=SUM(I4:I100000)');
  fix('FACTURAS & ABONOS VENTAS',1,10,'FACTURA[','=SUMIF(J4:J100000,"VENCIDA",I4:I100000)');
  fix('FACTURAS & ABONOS COMPRA',1,8,'FACTURACOMPRA[','=SUM(I4:I100000)');
  fix('FACTURAS & ABONOS COMPRA',1,10,'FACTURACOMPRA[','=SUMIF(J4:J100000,"VENCIDA",I4:I100000)');
  for(const sheet of ['FACTURA VENTA','FACTURA COMPRA']){
    const rows=DB[sheet]; if(!rows||!rows[0]) continue;
    if(rows[0][0]==='#VALUE!') rows[0][0]=null;
  }
}
fixLegacyFormulas();

// Relaciona cada línea de COMPRAS/VENTAS con su N° de factura sin alterar
// las columnas originales del Excel: el N° de factura se guarda como última columna.
function ensureInvoiceLinks(){
  for(const sheet of ['COMPRAS','VENTAS']){
    const rs=DB[sheet]||[];
    if(!rs.length) continue;
    const header=rs.find(r=>Array.isArray(r)&&String(r[0]??'').toUpperCase()===sheet);
    // En estas hojas el encabezado real es la fila que contiene CODIGO.
    const hi=rs.findIndex(r=>Array.isArray(r)&&String(r[0]??'').toUpperCase()==='CODIGO');
    if(hi<0) continue;
    if(String(rs[hi][rs[hi].length-1]??'').toUpperCase()!=='N_FACTURA') rs[hi].push('N_FACTURA');
    const portfolio=sheet==='VENTAS'?(DB['FACTURAS & ABONOS VENTAS']||[]):(DB['FACTURAS & ABONOS COMPRA']||[]);
    const used=new Set();
    for(let i=hi+1;i<rs.length;i++){
      const row=rs[i]; if(!row||!row[0]) continue;
      if(row.length<rs[hi].length) row.push('');
      if(row[rs[hi].length-1]) continue;
      const fecha=String(row[1]??'').slice(0,10);
      const total=num(sheet==='VENTAS'?row[8]:row[7]);
      let match=-1;
      for(let j=1;j<portfolio.length;j++){
        const pr=portfolio[j];
        const pf=String(pr?.[4]??'').slice(0,10), pi=num(pr?.[2]), pt=num(pr?.[5]);
        if(!used.has(pi) && pf===fecha && pt===total){match=j;break;}
      }
      if(match<0){
        const nums=portfolio.slice(1).map(r=>num(r?.[2])).filter(Boolean);
        const fallback=nums[i-hi-1];
        if(fallback) row[rs[hi].length-1]=fallback;
      } else { row[rs[hi].length-1]=portfolio[match][2]; used.add(num(portfolio[match][2])); }
    }
  }
}
ensureInvoiceLinks();

// Sincronización central: COMPRAS y VENTAS son las fuentes de movimiento del inventario.
function normalizeInventory(){
  const header=['CODIGO','NOMBRE DEL PRODUCTO','COMPRAS','VENTAS','STOCK','COSTO UNITARIO','VALOR DEL INVENTARIO'];
  const products=(DB['BASE DE DATOS DE PRODUCTOS']||[]).slice(2).filter(r=>r&&r[0]);
  const purchaseRows=(DB['COMPRAS']||[]).slice(4).filter(r=>r&&r[0]&&String(r[0]).toUpperCase()!=='CODIGO');
  const saleRows=(DB['VENTAS']||[]).slice(4).filter(r=>r&&r[0]&&String(r[0]).toUpperCase()!=='CODIGO');
  const old=(DB['INVENTARIO']||[]).filter(r=>r&&r[0]&&String(r[0]).toUpperCase()!=='CODIGO');
  const oldMap=new Map(old.map(r=>[String(r[0]),r]));
  const out=[['INVENTARIO'],[null,null,null,null,null,null,null,'TOTAL INVENTARIO'],[null,null,null,null,null,null,null,'=SUBTOTAL(9,G5:G100000)'],header];
  products.forEach(pr=>{
    const code=String(pr[0]),name=String(pr[1]||'');
    const qCompra=purchaseRows.filter(r=>String(r[0])===code).reduce((a,r)=>a+num(r[6]),0);
    const qVenta=saleRows.filter(r=>String(r[0])===code).reduce((a,r)=>a+num(r[7]),0);
    const oldr=oldMap.get(code);
    let cost=0;
    const last=purchaseRows.filter(r=>String(r[0])===code).at(-1);
    if(last) cost=num(last[5]); else if(oldr) cost=num(oldr[5]);
    const compras=qCompra; const ventas=qVenta; const stock=compras-ventas;
    out.push([code,name,compras,ventas,stock,cost,stock*cost]);
  });
  DB['INVENTARIO']=out;
}
normalizeInventory();
save();

function wireSetupForm(){
  document.getElementById('setupForm').onsubmit=function(e){
    e.preventDefault();
    const user=document.getElementById('su_user').value.trim();
    const pass=document.getElementById('su_pass').value;
    const pass2=document.getElementById('su_pass2').value;
    const email=document.getElementById('su_email').value.trim();

    if(pass.length<4){document.getElementById('authScreen').innerHTML=setupFormHTML('La contraseña debe tener al menos 4 caracteres.');wireSetupForm();return}
    setAuth({usuario:user,pass:pass,email:email,pregunta:q,respuesta:a.toLowerCase()});

function restoreLotsForSale(items){
  const lotes=DB['LOTES']||[];
  for(const item of items){

    const candidatos=lotes.slice(1).filter(r=>String(r[1]??'')===String(item.code))
      .sort((a,b)=>new Date(b[4])-new Date(a[4]));
    for(const r of candidatos){
      if(restante<=0) break;
      const cap=num(r[5])-num(r[9]);
      const add=Math.min(restante,cap);
      if(add>0){ r[9]=num(r[9])+add; restante-=add; }
    }
  }
  for(let i=1;i<lotes.length;i++){
    const r=lotes[i]; if(!r) continue;
    const saldo=num(r[9]); const venc=new Date(r[6]);
    r[8]=saldo<=0?'AGOTADO':(venc<new Date()?'VENCIDO':(Math.ceil((venc-new Date())/86400000)<=7?'POR VENCER':'VIGENTE'));
  }
}

function consumeLotsForSale(items){
  const lotes=DB['LOTES']||[];
  for(const item of items){
    let restante=num(item.qty);
    const candidatos=lotes.slice(1).filter(r=>String(r[1]??'')===String(item.code) && num(r[9])>0)
      .sort((a,b)=>new Date(a[4])-new Date(b[4]));
    for(const r of candidatos){
      if(restante<=0) break;
      const saldo=num(r[9]);
      const usar=Math.min(restante,saldo);
      r[9]=saldo-usar;
      restante-=usar;
    }
    if(restante>0) return {ok:false,code:item.code,missing:restante};
  }
  for(let i=1;i<lotes.length;i++){
    const r=lotes[i];
    if(!r) continue;
    const saldo=num(r[9]);
    const venc=new Date(r[6]);
    r[8]=saldo<=0?'AGOTADO':(venc<new Date()?'VENCIDO':(Math.ceil((venc-new Date())/86400000)<=7?'POR VENCER':'VIGENTE'));

  }
  return {ok:true};
}

function addExpense(e){
  e.preventDefault();
  const sel=document.getElementById('gcon');
  const concept=sel.value==='__OTRO__'?String(document.getElementById('gconOther').value||'').trim():String(sel.value||'').trim();
  const fecha=document.getElementById('gdate').value;
  const valor=num(document.getElementById('gval').value);
  if(!concept)return alert('Selecciona el concepto del gasto.');
  if(!fecha)return alert('Selecciona la fecha del gasto.');
  if(valor<=0)return alert('Ingresa un valor de gasto mayor que 0.');

  // Normalizamos GASTOS a una tabla real: CONCEPTO | FECHA | VALOR.
  const existing=expenseRows();
  DB['GASTOS']=[['CONCEPTO','FECHA','VALOR'],...existing,[concept,fecha,valor]];

  rebuildCashFlow();
  save();
  closeModal();
  toast(`Gasto registrado: ${money(valor)}`);
  show('gastos');
}
function rebuildCashFlow(){
  const months=new Map();

  function ensureMonth(value){
    if(!value)return null;
    const raw=String(value).slice(0,10);
    const dt=new Date(raw+'T00:00:00');
    if(isNaN(dt))return null;
    const y=dt.getFullYear(),m=dt.getMonth()+1,key=`${y}-${String(m).padStart(2,'0')}`;
    if(!months.has(key))months.set(key,{y,m,text:dt.toLocaleString('es-CO',{month:'long'}),in:0,pc:0,g:0});
    return months.get(key);
  }

  // GASTOS
  expenseRows().forEach(r=>{
    const x=ensureMonth(r[1]),v=num(r[2]);
    if(x&&v>0)x.g+=v;
  });

  // FACTURAS DE VENTA: solo CONTADO entra inmediatamente a caja.
  // Las ventas a crédito entran a caja únicamente mediante ABONOS.
  const fv=DB['FACTURAS & ABONOS VENTAS']||[];
  const hv=portfolioHeaderRow('FACTURAS & ABONOS VENTAS');
  fv.slice(hv+1).forEach(r=>{
    if(!Array.isArray(r)||r[2]==null||r[2]==='')return;
    const cond=String(r[3]??'').trim().toUpperCase();
    if(cond==='CONTADO'){
      const x=ensureMonth(r[4]),v=num(r[5]);
      if(x&&v>0)x.in+=v;
    }
  });

  // FACTURAS DE COMPRA: solo CONTADO sale inmediatamente de caja.
  // Las compras a crédito salen mediante ABONOS A PROVEEDOR.
  const fc=DB['FACTURAS & ABONOS COMPRA']||[];
  const hc=portfolioHeaderRow('FACTURAS & ABONOS COMPRA');
  fc.slice(hc+1).forEach(r=>{
    if(!Array.isArray(r)||r[2]==null||r[2]==='')return;
    const cond=String(r[3]??'').trim().toUpperCase();
    if(cond==='CONTADO'){
      const x=ensureMonth(r[4]),v=num(r[5]);
      if(x&&v>0)x.pc+=v;
    }
  });

  // ABONOS: en estas hojas se guardan en columnas 13=FECHA, 14=FACTURA, 15=MONTO.
  // Se usan solo las filas que tengan una fecha de abono y un monto positivo.
  function addAbonos(name,entrada){
    const rs=DB[name]||[];
    const h=portfolioHeaderRow(name);
    rs.slice(h+1).forEach(r=>{
      if(!Array.isArray(r))return;
      const fecha=r[13],monto=num(r[15]);
      if(!fecha||monto<=0)return;
      const x=ensureMonth(fecha);
      if(x){
        if(entrada)x.in+=monto;
        else x.pc+=monto;
      }
    });
  }
  addAbonos('FACTURAS & ABONOS VENTAS',true);
  addAbonos('FACTURAS & ABONOS COMPRA',false);

  const data=[['AÑO','MES','MES_TEXTO','ENTRADAS','SALIDAS COMPRAS','SALIDAS GASTOS','FLUJO NETO','SALDO ACUMULADO']];
  let saldo=0;
  [...months.values()].sort((a,b)=>a.y-b.y||a.m-b.m).forEach(x=>{
    const net=x.in-x.pc-x.g;
    saldo+=net;
    data.push([x.y,x.m,x.text,x.in,x.pc,x.g,net,saldo]);
  });
  DB['FLUJO DE CAJA']=data;
}



function businessResultSummary(){
  // VENTAS: total facturado desde FACTURAS & ABONOS VENTAS.
  // COSTO DE LO VENDIDO: costo unitario real de cada línea vendida x cantidad.
  const fv=DB['FACTURAS & ABONOS VENTAS']||[];
  const hf=portfolioHeaderRow('FACTURAS & ABONOS VENTAS');
  const ventas=fv.slice(hf+1).reduce((a,r)=>{
    if(!Array.isArray(r)||r[2]==null||r[2]==='') return a;
    return a+num(r[5]);
  },0);

  const vr=DB['VENTAS']||[];
  const hv=vr.findIndex(r=>Array.isArray(r)&&String(r[0]??'').toUpperCase()==='CODIGO');
  const costo=vr.slice(hv>=0?hv+1:1).reduce((a,r)=>{
    if(!Array.isArray(r)||!r[0]) return a;
    return a+(num(r[6])*num(r[7]));
  },0);

  const gastos=expenseRows().reduce((a,r)=>a+num(r[2]),0);
  return {ventas,costo,utilidad:ventas-costo,gastos,operativa:ventas-costo-gastos};
}

function portfolioSummary(sheet){
  const rs=DB[sheet]||[];
  const h=portfolioHeaderRow(sheet);
  const rowsData=rs.slice(h+1);
  let total=0, saldo=0, pendientes=0, vencidas=0;
  const today=new Date(); today.setHours(0,0,0,0);
  rowsData.forEach(r=>{
    if(!Array.isArray(r)||r[2]==null||r[2]==='') return;
    const importe=num(r[5]), pago=num(r[7]), sal=num(r[8]);
    total+=importe; saldo+=sal;
    if(sal>0){
      pendientes++;
      const venc=r[6];
      if(venc){
        const d=new Date(String(venc).slice(0,10)+'T00:00:00');
        if(!isNaN(d)&&d<today) vencidas++;
      }
    }
  });
  return {total,saldo,pendientes,vencidas};
}

function renderLots(c){let rs=rows('LOTES').slice(1);let today=new Date();c.innerHTML=`<div class="title">LOTES DE INVENTARIO</div><div class="sub">Vencimiento de los lotes: un mes después de la compra.</div><div class="tablewrap"><table class="tbl"><tr>${headers(rows('LOTES')).map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${rs.map(r=>{let d=new Date(r[6]),days=Math.ceil((d-today)/86400000);let st=days<0?'VENCIDO':days<=7?'POR VENCER':'VIGENTE';return `<tr>${r.map((v,j)=>`<td>${j===6?date(v):j===7?days:j===8?st:esc(v??'')}</td>`).join('')}</tr>`}).join('')}</table></div>`}
function portfolioHeaderRow(name){const rs=rows(name);const i=rs.findIndex(r=>Array.isArray(r)&&r.some(v=>String(v??'').trim().toUpperCase()==='N_FACTURA'));return i>=0?i:0}
function portfolioDataRows(name){const rs=rows(name);const h=portfolioHeaderRow(name);return rs.slice(h+1).filter(r=>Array.isArray(r)&&r.some(v=>v!==null&&v!==''));}
function portfolioDataRowsIndexed(name){const rs=rows(name);const h=portfolioHeaderRow(name);const out=[];for(let i=h+1;i<rs.length;i++){const r=rs[i];if(Array.isArray(r)&&r.some(v=>v!==null&&v!=='')) out.push({idx:i,row:r});}return out;}
function applyAbonoDelta(name,factura,delta){
  const rs=DB[name]||[];
  const h=portfolioHeaderRow(name);
  const r=rs.find((row,i)=>i>h && num(row?.[2])===factura);
  if(!r) return null;
  r[7]=Math.max(0,num(r[7])+delta);
  r[8]=Math.max(0,num(r[5])-r[7]);
  const venc=new Date(r[6]);
  r[9]=r[8]===0?'CANCELADO':(venc<new Date()?'VENCIDA':'PENDIENTE');
  r[10]=r[8]===0?'-':(r[10]==='-'?Math.max(0,Math.ceil((venc-new Date())/86400000)):r[10]);
  return r;
}
function calcPortfolio(t){let name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';let rs=portfolioDataRows(name).filter(r=>r[2]!=null&&r[2]!=='');return {balance:rs.reduce((s,r)=>s+num(r[8]),0),rows:rs}}
function compactPortfolioTable(t){let name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';let h=rows(name)[portfolioHeaderRow(name)]||[];let rs=portfolioDataRows(name).filter(r=>r[2]!=null&&r[2]!=='');let cols=t==='venta'?['ID_CLIENTE','CLIENTE','N_FACTURA','CONDICION','FECHA _FACTURA','IMPORTE','FECHA_VENCIMIENTO','PAGO','SALDO','ESTADO','DIAS','RANGO']:['ID_PROVEEDOR','PROVEEDOR','N_FACTURA','CONDICION','FECHA _FACTURA','IMPORTE','FECHA_VENCIMIENTO','PAGO','SALDO','ESTADO','DIAS','RANGO'];let idx=cols.map(x=>h.findIndex(y=>String(y??'').trim().toUpperCase()===x));let facIdx=idx[cols.indexOf('N_FACTURA')];return `<div class="tablewrap cartera-table"><table class="tbl"><thead><tr>${cols.map(x=>`<th>${esc(x.replace('FECHA _FACTURA','FECHA FACTURA'))}</th>`).join('')}<th></th></tr></thead><tbody>${rs.map(r=>{const fac=num(r[facIdx]);return `<tr>${idx.map((j,k)=>{let v=j>=0?r[j]:'';if(cols[k].includes('FECHA'))v=date(v);if(cols[k]==='IMPORTE'||cols[k]==='PAGO'||cols[k]==='SALDO')v=money(v);return `<td>${esc(v??'')}</td>`}).join('')}<td class="actions">${t==='venta'?`<button class="btn alt" onclick="editSale(${fac})">Editar</button><button class="btn danger" onclick="deleteSale(${fac})">Eliminar</button>`:`<button class="btn alt" onclick="editPurchase(${fac})">Editar</button><button class="btn danger" onclick="deletePurchase(${fac})">Eliminar</button>`}</td></tr>`}).join('')||'<tr><td colspan="13" class="empty">No hay facturas registradas.</td></tr>'}</tbody></table></div>`}
function abonosTable(t){
  let name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';
  let h=rows(name)[portfolioHeaderRow(name)]||[];
  let f=h.findIndex(x=>String(x??'').trim().toUpperCase().startsWith('FACTURA'));
  let dateI=h.findIndex(x=>String(x??'').trim().toUpperCase()==='FECHA');
  let m=h.findIndex(x=>String(x??'').trim().toUpperCase()==='MONTO');
  if(f<0||dateI<0||m<0)return '';
  let rs=portfolioDataRowsIndexed(name).filter(x=>x.row[f]!=null&&x.row[m]!=null);
  let data=rs.map(x=>`<tr><td>${date(x.row[dateI])}</td><td>${esc(x.row[f])}</td><td>${money(x.row[m])}</td><td class="actions"><button class="btn alt" onclick="editAbono('${name}',${x.idx})">Editar</button><button class="btn danger" onclick="deleteAbono('${name}',${x.idx})">Eliminar</button></td></tr>`).join('');
  return `<h3 style="margin-top:18px">ABONOS REGISTRADOS</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>FECHA</th><th>N° FACTURA</th><th>MONTO</th><th></th></tr></thead><tbody>${data||'<tr><td colspan="4" class="empty">No hay abonos registrados.</td></tr>'}</tbody></table></div>`;
}
function editAbono(name,idx){
  const rs=DB[name]||[];
  const r=rs[idx];
  if(!r) return;
  openModal(`<h3>Editar abono</h3><form class="form" onsubmit="saveAbonoEdit(event,'${name}',${idx})"><div class="field"><label>N° factura</label><input value="${esc(r[14])}" disabled></div><div class="field"><label>Fecha</label><input id="eabfecha" type="date" value="${iso(r[13])}" required></div><div class="field"><label>Valor abono</label><input id="eabval" type="number" min="0.01" step="0.01" value="${num(r[15])}" required></div><div class="full actions"><button class="btn">Guardar cambios</button><button class="btn alt" type="button" onclick="closeModal()">Cancelar</button></div></form>`);
}
function saveAbonoEdit(e,name,idx){
  e.preventDefault();
  const rs=DB[name]||[];
  const r=rs[idx];
  if(!r) return closeModal();
  const factura=num(r[14]);
  const oldMonto=num(r[15]);
  const newFecha=document.getElementById('eabfecha').value;
  const newMonto=num(document.getElementById('eabval').value);
  if(!newFecha) return toast('Selecciona la fecha del abono.');
  if(newMonto<=0) return toast('Ingresa un valor de abono mayor que 0.');
  const inv=applyAbonoDelta(name,factura,-oldMonto);
  if(!inv) return toast('Factura no encontrada');
  const saldoDisponible=Math.max(0,num(inv[5])-num(inv[7]));
  if(newMonto>saldoDisponible){
    applyAbonoDelta(name,factura,oldMonto);
    return toast(`El abono no puede superar el saldo pendiente de ${money(saldoDisponible)}.`);
  }
  applyAbonoDelta(name,factura,newMonto);
  r[13]=newFecha;
  r[15]=newMonto;
  rebuildCashFlow();
  save();
  closeModal();
  toast('Abono actualizado');
  show(name==='FACTURAS & ABONOS VENTAS'?'carteraventa':'carteracompra');
}
function deleteAbono(name,idx){
  const rs=DB[name]||[];
  const r=rs[idx];
  if(!r) return;
  if(!confirm(`¿Eliminar el abono de ${money(num(r[15]))} de la factura N° ${r[14]}? Esto aumentará el saldo pendiente de la factura.`)) return;
  const factura=num(r[14]);
  const monto=num(r[15]);
  applyAbonoDelta(name,factura,-monto);
  rs.splice(idx,1);
  rebuildCashFlow();
  save();
  toast('Abono eliminado');
  show(name==='FACTURAS & ABONOS VENTAS'?'carteraventa':'carteracompra');
}
function renderPortfolio(c,t){let name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';let p=calcPortfolio(t);c.innerHTML=`<div class="title">${name}</div><div class="cards"><div class="card metric"><span>Total cartera</span><b>${money(p.balance)}</b></div><div class="card metric"><span>Facturas</span><b>${p.rows.length}</b></div></div><div class="actions" style="margin:12px 0"><button class="btn" onclick="newAbono('${t}')">+ Registrar abono</button></div><div class="card"><h3>Facturas</h3>${compactPortfolioTable(t)}${abonosTable(t)}</div>`}
function newAbono(t){
  openModal(`<h3>Registrar abono</h3><form class="form" onsubmit="addAbono(event,'${t}')"><div class="field"><label>N° factura</label><input id="abfact" type="number" min="1" required></div><div class="field"><label>Valor abono</label><input id="abval" type="number" min="0" required></div><div class="full actions"><button class="btn">Registrar abono</button><button class="btn alt" type="button" onclick="closeModal()">Cancelar</button></div></form>`);
}
function addAbono(e,t){
  e.preventDefault();
  const name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';
  const rs=DB[name]||[];
  const invoice=num(document.getElementById('abfact').value);
  const v=num(document.getElementById('abval').value);
  if(!invoice||v<=0)return toast('Ingresa una factura y un valor de abono válido.');
  const h=portfolioHeaderRow(name);
  const r=rs.find((row,i)=>i>h && num(row?.[2])===invoice);
  if(!r)return toast('Factura no encontrada');
  const saldoActual=Math.max(0,num(r[5])-num(r[7]));
  if(v>saldoActual)return toast(`El abono no puede superar el saldo pendiente de ${money(saldoActual)}.`);
  r[7]=num(r[7])+v;
  r[8]=Math.max(0,num(r[5])-r[7]);
  const venc=new Date(r[6]);
  r[9]=r[8]===0?'CANCELADO':(venc<new Date()?'VENCIDA':'PENDIENTE');
  r[10]=r[8]===0?'-':(r[10]==='-'?Math.max(0,Math.ceil((venc-new Date())/86400000)):r[10]);
  const fechaAbono=iso(new Date());
  const abonoRow=[];
  const width=Math.max(16, ...rs.map(x=>Array.isArray(x)?x.length:0));
  for(let i=0;i<width;i++)abonoRow.push(null);
  abonoRow[13]=fechaAbono;
  abonoRow[14]=invoice;
  abonoRow[15]=v;
  rs.push(abonoRow);
  DB[name]=rs;
  rebuildCashFlow();
  save();
  closeModal();
  toast(`Abono registrado el ${date(fechaAbono)}`);
  show(t==='venta'?'carteraventa':'carteracompra');
}
function salesHistoryTable(){let rs=rows('FACTURAS & ABONOS VENTAS').slice(1).filter(r=>r[2]!=null&&r[2]!==''),h=['N° FACTURA','CLIENTE','CONDICION','FECHA','IMPORTE','PAGO','SALDO','ESTADO'];return `<div class="tablewrap"><table class="tbl"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}<th></th></tr></thead><tbody>${rs.slice(-10).reverse().map(r=>`<tr><td>${esc(r[2])}</td><td>${esc(r[1]||'Venta directa')}</td><td>${esc(r[3])}</td><td>${date(r[4])}</td><td>${money(r[5])}</td><td>${money(r[7])}</td><td>${money(r[8])}</td><td>${esc(r[9])}</td><td class="actions"><button class="btn alt" onclick="editSale(${num(r[2])})">Editar</button><button class="btn danger" onclick="deleteSale(${num(r[2])})">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`}
function updateInvoiceSheet(t,invoice,d,venc,party,total,cond,items){
  let name=t==='venta'?'FACTURA VENTA':'FACTURA COMPRA',r=DB[name]||[];
  if(!r.length)return;
  // Fecha de vencimiento de la cartera = vencimiento del crédito (0, 8 o 15 días).
  // Para FACTURA COMPRA además mostramos, por cada producto, el vencimiento del LOTE (1 mes desde la compra).
  for(let i=0;i<r.length;i++){
    if(String(r[i][6]??'')==='Factura No.:')r[i][7]=invoice;
    if(String(r[i][6]??'')==='Fecha:')r[i][7]=iso(d);
    if(String(r[i][6]??'')==='Fecha de vencimiento:')r[i][7]=iso(venc);
    if(String(r[i][6]??'')==='Pago Contado')r[i][8]=cond===0?total:0;
    if(String(r[i][6]??'').trim()==='Pago Crédito')r[i][8]=cond>0?total:0;
    if(String(r[i][6]??'').trim()==='Días Crédito')r[i][8]=cond;
  }
  let infoRow=r.findIndex(x=>String(x[0]??'').toUpperCase()===(t==='venta'?'CLIENTE':'PROVEEDOR'));
  if(infoRow>=0)r[infoRow][1]=party;
  let header=r.findIndex(x=>String(x[0]??'').toUpperCase()==='CÓDIGO'||String(x[0]??'').toUpperCase()==='CODIGO');
  if(header>=0){
    // Conservamos la sección INFORMACIÓN DE PAGO de la plantilla y reemplazamos solo las filas de productos.
    let payStart=r.findIndex((row,idx)=>idx>header && (String(row[7]??'').trim()==='Total Factura'||String(row[7]??'').trim()==='INFORMACIÓN DE PAGO'));
    let removeCount=payStart>=0?payStart-header-1:Math.max(0,r.length-(header+1));
    if(removeCount>0)r.splice(header+1,removeCount);
    let itemRows=items.map(x=>{
      if(t==='compra'){
        let loteVenc=new Date(d);
        loteVenc.setMonth(loteVenc.getMonth()+1);
        return [x.code,x.name,x.qty,x.cost,null,x.total,iso(loteVenc),null,null];
      }
      return [x.code,x.name,x.qty,x.price,null,x.total,null,null,null];
    });
    r.splice(header+1,0,...itemRows);
  }
  save();
}
function invoiceOptions(t,selected){
  const name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';
  return rows(name).slice(1).filter(r=>r&&r[2]!=null&&r[2]!=='').sort((a,b)=>num(a[2])-num(b[2])).map(r=>`<option value="${esc(r[2])}" ${num(r[2])===num(selected)?'selected':''}>Factura N° ${esc(r[2])} — ${esc(r[1]||'')}</option>`).join('');
}
function renderLinkedInvoice(c,t,invoice){
  const portName=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';
  const pr=rows(portName).slice(1).find(r=>num(r[2])===num(invoice));
  if(!pr){c.innerHTML='<div class="empty">Factura no encontrada.</div>';return}
  const sheet=t==='venta'?'VENTAS':'COMPRAS';
  const all=rows(sheet); const hi=all.findIndex(r=>String(r?.[0]??'').toUpperCase()==='CODIGO');
  const lines=all.slice(hi+1).filter(r=>r&&r[0]&&num(r[r.length-1])===num(invoice));
  const dateFactura=date(pr[4]), venc=date(pr[6]), total=num(pr[5]), pago=num(pr[7]), saldo=num(pr[8]), cond=pr[3]||'CONTADO';
  const party=pr[1]||'';
  const headersLine=t==='venta'?['Código','Producto','Cantidad','Precio Unit.','Total']:['Código','Producto','Cantidad','Costo Unit.','Vencimiento lote','Total'];
  const body=lines.map(r=>{
    const lote=t==='compra'?(()=>{let d=new Date(r[1]);d.setMonth(d.getMonth()+1);return date(d)})():'';
    return t==='venta'?`<tr><td>${esc(r[0])}</td><td>${esc(r[4])}</td><td>${num(r[7])}</td><td>${money(r[5])}</td><td>${money(r[8])}</td></tr>`:`<tr><td>${esc(r[0])}</td><td>${esc(r[4])}</td><td>${num(r[6])}</td><td>${money(r[5])}</td><td>${lote}</td><td>${money(r[7])}</td></tr>`;
  }).join('');
  c.innerHTML=`<div class="title">${t==='venta'?'FACTURA DE VENTA':'FACTURA DE COMPRA'}</div>
  <div class="sub">Factura vinculada directamente con ${t==='venta'?'VENTAS':'COMPRAS'} y ${t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA'}.</div>
  <div class="card"><div class="form"><div class="field"><label>Seleccionar factura</label><select onchange="showLinkedInvoice('${t}',this.value)">${invoiceOptions(t,invoice)}</select></div><div class="field"><label>N° factura</label><input value="${esc(invoice)}" readonly></div><div class="field"><label>${t==='venta'?'Cliente':'Proveedor'}</label><input value="${esc(party)}" readonly></div><div class="field"><label>Condición</label><input value="${esc(cond)}" readonly></div><div class="field"><label>Fecha</label><input value="${esc(dateFactura)}" readonly></div><div class="field"><label>Fecha de vencimiento crédito</label><input value="${esc(venc)}" readonly></div></div></div>
  <div class="card" style="margin-top:12px"><h3>Detalle de la factura N° ${esc(invoice)}</h3><div class="tablewrap"><table class="tbl"><thead><tr>${headersLine.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body||'<tr><td colspan="6" class="empty">No hay productos asociados a esta factura.</td></tr>'}</tbody></table></div>
  <div class="card" style="margin-top:10px"><b>Total factura: ${money(total)}</b><br>Pago: ${money(pago)}<br>Saldo: ${money(saldo)}<br>Estado: <b>${esc(pr[9]||'')}</b></div></div>`;
}
function showLinkedInvoice(t,invoice){let c=document.getElementById('content');renderLinkedInvoice(c,t,num(invoice))}
function renderInvoice(c,t){
  const name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';
  const list=rows(name).slice(1).filter(r=>r&&r[2]!=null&&r[2]!=='');
  const latest=list.reduce((m,r)=>Math.max(m,num(r[2])),0);
  if(!latest){c.innerHTML=`<div class="title">${t==='venta'?'FACTURA VENTA':'FACTURA COMPRA'}</div><div class="empty">Todavía no hay facturas registradas.</div>`;return}
  renderLinkedInvoice(c,t,latest);
}

async function importExcel(file){if(!file)return;try{if(!window.XLSX){await loadXLSX()}let buf=await file.arrayBuffer();let wb=XLSX.read(buf,{type:'array',cellDates:true});let n={};wb.SheetNames.forEach(s=>{n[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:true,defval:null})});DB=n;save();toast('Excel importado');show('menu')}catch(e){alert('No se pudo importar el Excel: '+e.message)}}
function loadXLSX(){return new Promise((res,rej)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function resetTestData(){
  const ok=confirm('¿Seguro que quieres comenzar de nuevo?\n\nSe borrarán los datos de prueba de compras, ventas, facturas, abonos, lotes, gastos y flujo de caja.\n\nSe conservarán productos, clientes, proveedores y la estructura del sistema.');
  if(!ok)return;

  // IMPORTANTE: no dejamos solo la primera fila de cada hoja.
  // Las hojas COMPRAS/VENTAS necesitan sus encabezados para que
  // la sincronización pueda leer las nuevas operaciones, y las hojas
  // de cartera necesitan conservar su fila N_FACTURA + AGING.
  const copyRows=n=>{
    const base=INITIAL[n]||[];
    if(!base.length)return [];
    if(n==='COMPRAS'||n==='VENTAS') return base.slice(0,4).map(r=>Array.isArray(r)?[...r]:r);
    if(n==='LOTES') return base.slice(0,2).map(r=>Array.isArray(r)?[...r]:r);
    if(n==='FACTURA COMPRA'||n==='FACTURA VENTA') return base.map(r=>Array.isArray(r)?[...r]:r);
    if(n==='FACTURAS & ABONOS COMPRA'||n==='FACTURAS & ABONOS VENTAS'){
      const out=base.slice(0,3).map(r=>Array.isArray(r)?[...r]:r);
      // Conserva las tablas auxiliares de ABONOS/AGING, pero elimina
      // cualquier factura/abono de prueba de las columnas principales.
      for(let i=3;i<base.length;i++){
        const r=Array.isArray(base[i])?[...base[i]]:[];
        // Borra también ABONOS (FECHA/FACTURA/MONTO) para comenzar desde cero.
        for(let j=0;j<16;j++) r[j]=null;
        out.push(r);
      }
      return out;
    }
    if(n==='GASTOS') return (base.slice(0,3)||[]).map(r=>Array.isArray(r)?[...r]:r);
    if(n==='FLUJO DE CAJA') return base.slice(0,2).map(r=>Array.isArray(r)?[...r]:r);
    return base.map(r=>Array.isArray(r)?[...r]:r);
  };

  const tx=['COMPRAS','VENTAS','FACTURA VENTA','FACTURA COMPRA','FACTURAS & ABONOS VENTAS','FACTURAS & ABONOS COMPRA','LOTES','GASTOS','FLUJO DE CAJA'];
  tx.forEach(n=>DB[n]=copyRows(n));

  // Reiniciar inventario conservando los productos configurados.
  const prod=DB['BASE DE DATOS DE PRODUCTOS']||[];
  const phIndex=prod.findIndex(r=>Array.isArray(r)&&r.some(v=>String(v).toUpperCase().includes('CODIGO')));
  const ph=phIndex>=0?prod[phIndex]:[];
  const ih=(INITIAL['INVENTARIO']||[])[3]||['CODIGO','NOMBRE DEL PRODUCTO','COMPRAS','VENTAS','STOCK','COSTO UNITARIO','VALOR DEL INVENTARIO'];
  const codeIdx=ph.findIndex(v=>String(v).toUpperCase().includes('CODIGO'));
  const nameIdx=ph.findIndex(v=>String(v).toUpperCase().includes('NOMBRE'));
  const invRows=[Array.isArray((INITIAL['INVENTARIO']||[])[0])?[...(INITIAL['INVENTARIO']||[])[0]]:['INVENTARIO'],[null,null,null,null,null,null,null,'TOTAL INVENTARIO'],[null,null,null,null,null,null,null,null],Array.isArray(ih)?[...ih]:ih];
  prod.slice(phIndex+1).forEach(r=>{
    if(!Array.isArray(r))return;
    const code=codeIdx>=0?r[codeIdx]:r[0];
    const name=nameIdx>=0?r[nameIdx]:r[1];
    if(code && name) invRows.push([code,name,0,0,0,0,0]);
  });
  DB['INVENTARIO']=invRows;

  // Reconstrucción final: debe quedar lista para que la primera compra
  // aparezca inmediatamente en INVENTARIO y en FACTURAS & ABONOS COMPRA.
  ensureInvoiceLinks();
  normalizeInventory();
  save();
  toast('Sistema reiniciado correctamente: estructura conservada y movimientos en cero');
  show('menu');
}
