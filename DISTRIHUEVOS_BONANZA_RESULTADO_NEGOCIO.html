// Relaciona cada línea de COMPRAS/VENTAS con su N° de factura sin alterar
// las columnas originales del Excel: el N° de factura se guarda como última columna.
function ensureInvoiceLinks(){
  for(const sheet of ['COMPRAS','VENTAS']){
    const rs=DB[sheet]||[];
    if(!rs.length) continue;
    const header=rs.find(r=>Array.isArray(r)&&String(r[0]??'').toUpperCase()===sheet);
    // En estas hojas el encabezado real es la fila que contiene CODIGO.
    const hi=rs.findIndex(r=>Array.isArray(r)&&String(r[0]??'').toUpperCase()==='CODIGO');
    if(hi<0) continue;
    if(String(rs[hi][rs[hi].length-1]??'').toUpperCase()!=='N_FACTURA') rs[hi].push('N_FACTURA');
    const portfolio=sheet==='VENTAS'?(DB['FACTURAS & ABONOS VENTAS']||[]):(DB['FACTURAS & ABONOS COMPRA']||[]);
    const used=new Set();
    for(let i=hi+1;i<rs.length;i++){
      const row=rs[i]; if(!row||!row[0]) continue;
      if(row.length<rs[hi].length) row.push('');
      if(row[rs[hi].length-1]) continue;
      const fecha=String(row[1]??'').slice(0,10);
      const total=num(sheet==='VENTAS'?row[8]:row[7]);
      let match=-1;
      for(let j=1;j<portfolio.length;j++){
        const pr=portfolio[j];
        const pf=String(pr?.[4]??'').slice(0,10), pi=num(pr?.[2]), pt=num(pr?.[5]);
        if(!used.has(pi) && pf===fecha && pt===total){match=j;break;}
      }
      if(match<0){
        const nums=portfolio.slice(1).map(r=>num(r?.[2])).filter(Boolean);
        const fallback=nums[i-hi-1];
        if(fallback) row[rs[hi].length-1]=fallback;
      } else { row[rs[hi].length-1]=portfolio[match][2]; used.add(num(portfolio[match][2])); }
    }
  }
}
ensureInvoiceLinks();

// Sincronización central: COMPRAS y VENTAS son las fuentes de movimiento del inventario.
function normalizeInventory(){
  const header=['CODIGO','NOMBRE DEL PRODUCTO','COMPRAS','VENTAS','STOCK','COSTO UNITARIO','VALOR DEL INVENTARIO'];
  const products=(DB['BASE DE DATOS DE PRODUCTOS']||[]).slice(2).filter(r=>r&&r[0]);
  const purchaseRows=(DB['COMPRAS']||[]).slice(4).filter(r=>r&&r[0]&&String(r[0]).toUpperCase()!=='CODIGO');
  const saleRows=(DB['VENTAS']||[]).slice(4).filter(r=>r&&r[0]&&String(r[0]).toUpperCase()!=='CODIGO');
  const old=(DB['INVENTARIO']||[]).filter(r=>r&&r[0]&&String(r[0]).toUpperCase()!=='CODIGO');
  const oldMap=new Map(old.map(r=>[String(r[0]),r]));
  const out=[['INVENTARIO'],[null,null,null,null,null,null,null,'TOTAL INVENTARIO'],[null,null,null,null,null,null,null,null],header];
  products.forEach(pr=>{
    const code=String(pr[0]),name=String(pr[1]||'');
    const qCompra=purchaseRows.filter(r=>String(r[0])===code).reduce((a,r)=>a+num(r[6]),0);
    const qVenta=saleRows.filter(r=>String(r[0])===code).reduce((a,r)=>a+num(r[7]),0);
    const oldr=oldMap.get(code);
    let cost=0;
    const last=purchaseRows.filter(r=>String(r[0])===code).at(-1);
    if(last) cost=num(last[5]); else if(oldr) cost=num(oldr[5]);
    const compras=qCompra; const ventas=qVenta; const stock=compras-ventas;
    out.push([code,name,compras,ventas,stock,cost,stock*cost]);
  });
  DB['INVENTARIO']=out;
}
normalizeInventory();
save();

function table(name,limit=500){let rs=rows(name); if(!rs.length)return '<div class="empty">Sin registros.</div>';let h=headers(rs);return `<div class="tablewrap"><table class="tbl"><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rs.slice(1,limit+1).map((r,i)=>`<tr>${h.map((_,j)=>`<td>${esc(r[j]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

let saleCart=[],purchaseCart=[];
function renderSale(c){let inv=nextInvoice('venta');c.innerHTML=`<div class="title">VENTAS / FACTURA DE VENTA</div><div class="sub">Una venta puede contener varios productos. Condiciones permitidas: contado, 8 o 15 días.</div><div class="card"><div class="form"><div class="field"><label>N° factura</label><input id="sinv" type="number" min="1" step="1" value="${inv}"></div><div class="field"><label>Cliente</label><select id="sclient"><option value="">Venta directa</option>${clientOpts()}</select></div><div class="field"><label>Condición</label>${creditSelect('scond')}</div><div class="field"><label>Fecha</label><input id="sdate" type="date" value="${iso(new Date())}"></div><div class="field"><label>Fecha de vencimiento</label><input id="screditvenc" type="text" readonly></div><div class="field"><label>Descuento</label><input id="sdisc" type="number" value="0" min="0"></div><div class="field"><label>Producto</label><select id="sprod">${productOpts()}</select></div><div class="field"><label>Cantidad</label><input id="sqty" type="number" min="1" value="1"></div><div class="field"><label>Precio unitario</label><input id="sprice" type="number" min="0"></div><div class="field actions" style="align-items:end"><button class="btn" type="button" onclick="addSaleItem()">+ Agregar producto</button></div></div><div id="salecart"></div><div class="actions"><button class="btn" onclick="saveSale()">Registrar venta N° ${inv}</button><button class="btn alt" onclick="saleCart=[];drawSaleCart()">Limpiar</button></div></div><div class="card" style="margin-top:14px"><h3>Últimas ventas</h3>${salesHistoryTable()}</div>`;document.getElementById('sinv').oninput=()=>{let n=num(document.getElementById('sinv').value);document.querySelectorAll('#ventas .actions .btn')[0]?.replaceChildren(document.createTextNode('Registrar venta N° '+(n||'')))};const refreshSaleVenc=()=>{let d=new Date(document.getElementById('sdate').value+'T12:00:00');let cond=num(document.getElementById('scond').value);let venc=new Date(d);venc.setDate(venc.getDate()+cond);document.getElementById('screditvenc').value=date(venc)};document.getElementById('sdate').onchange=refreshSaleVenc;document.getElementById('scond').onchange=refreshSaleVenc;document.getElementById('sprod').onchange=()=>{let p=productList().find(x=>x.code===sprod.value);sprice.value=p?p.cost:0};document.getElementById('sprod').dispatchEvent(new Event('change'));refreshSaleVenc();drawSaleCart()}
function addSaleItem(){let p=productList().find(x=>x.code===sprod.value),q=num(sqty.value),price=num(sprice.value);if(!p||q<1)return toast('Seleccione producto y cantidad');let used=saleCart.filter(x=>x.code===p.code).reduce((s,x)=>s+x.qty,0);if(q+used>p.stock)return toast('Stock insuficiente');saleCart.push({code:p.code,name:p.name,qty:q,price,total:q*price});drawSaleCart()}
function drawSaleCart(){let el=document.getElementById('salecart');if(!el)return;let total=saleCart.reduce((s,x)=>s+x.total,0);el.innerHTML=`<h3>Detalle de venta</h3>${saleCart.length?`<div class="tablewrap"><table class="tbl"><tr><th>Código</th><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Total</th><th></th></tr>${saleCart.map((x,i)=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.total)}</td><td><button class="btn danger" onclick="saleCart.splice(${i},1);drawSaleCart()">Eliminar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No hay productos agregados.</div>'}<div class="card" style="margin-top:10px"><b>Total venta: ${money(total)}</b></div>`}
function saveSale(){
  if(!saleCart.length)return toast('Agregue productos');
  let cond=num(scond.value),d=new Date(sdate.value+'T12:00:00'),client=sclient.value||'',invoice=num(document.getElementById('sinv').value);
  if(!Number.isInteger(invoice)||invoice<1)return toast('Ingresa un N° de factura válido.');
  if(rows('FACTURAS & ABONOS VENTAS').slice(1).some(r=>num(r[2])===invoice))return toast('Ese N° de factura ya existe en ventas. Usa otro número.');
  normalizeInventory();
  for(const x of saleCart){
    const inv=productList().find(p=>p.code===x.code);
    if(!inv || num(x.qty)>num(inv.stock)) return toast(`Stock insuficiente para ${x.name}. Disponible: ${inv?inv.stock:0} unidades.`);
    const lotes=(DB['LOTES']||[]).slice(1).filter(r=>String(r[1]??'')===String(x.code) && num(r[9])>0);
    const lotStock=lotes.reduce((a,r)=>a+num(r[9]),0);
    if(lotStock<num(x.qty)) return toast(`No hay suficientes unidades en lotes para ${x.name}. Disponibles en lotes: ${lotStock}.`);
  }
  let total=saleCart.reduce((s,x)=>s+x.total,0)-num(sdisc.value);if(total<0)total=0;
  let ws=DB['VENTAS'];
  saleCart.forEach(x=>{let prod=productList().find(p=>p.code===x.code);let costo=prod?num(prod.cost):0;ws.push([x.code,iso(d),d.toLocaleString('es-CO',{month:'long'}),d.getFullYear(),x.name,x.price,costo,x.qty,x.total,x.qty*(x.price-costo),invoice]);});
  let cv=DB['FACTURAS & ABONOS VENTAS'];let id=rows('CLIENTES').find(r=>r[1]===client)?.[0]||'';let venc=new Date(d);venc.setDate(venc.getDate()+cond);let pago=cond===0?total:0;
  cv.push([id,client,invoice,cond===0?'CONTADO':`${cond} DIAS`,iso(d),total,iso(venc),pago,total-pago,total-pago===0?'CANCELADO':(new Date()>venc?'VENCIDA':'PENDIENTE'),cond===0?'-':cond,'']);
  updateInvoiceSheet('venta',invoice,d,venc,client,total,cond,saleCart);
  const result=updateInventoryAfterSale(saleCart);
  if(!result.ok){
    ws.splice(ws.length-saleCart.length,saleCart.length);
    cv.pop();
    return toast(`No se pudo descontar el lote de ${result.code}.`);
  }
  rebuildCashFlow(); save();saleCart=[];toast(`Venta registrada — Factura N° ${invoice}`);show('ventas')
}
function consumeLotsForSale(items){
  const lotes=DB['LOTES']||[];
  for(const item of items){
    let restante=num(item.qty);
    const candidatos=lotes.slice(1).filter(r=>String(r[1]??'')===String(item.code) && num(r[9])>0)
      .sort((a,b)=>new Date(a[4])-new Date(b[4]));
    for(const r of candidatos){
      if(restante<=0) break;
      const saldo=num(r[9]);
      const usar=Math.min(restante,saldo);
      r[9]=saldo-usar;
      restante-=usar;
    }
    if(restante>0) return {ok:false,code:item.code,missing:restante};
  }
  for(let i=1;i<lotes.length;i++){
    const r=lotes[i];
    if(!r) continue;
    const saldo=num(r[9]);
    const venc=new Date(r[6]);
    r[8]=saldo<=0?'AGOTADO':(venc<new Date()?'VENCIDO':(Math.ceil((venc-new Date())/86400000)<=7?'POR VENCER':'VIGENTE'));
    r[7]=isNaN(venc)?r[7]:Math.ceil((venc-new Date())/86400000);
  }
  return {ok:true};
}
function updateInventoryAfterSale(items){
  normalizeInventory();
  const result=consumeLotsForSale(items);
  if(!result.ok) return result;
  normalizeInventory();
  save();
  return result;
}
function nextInvoice(t){let arr=rows(t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA').slice(1);return arr.reduce((m,r)=>Math.max(m,num(r[2])),0)+1}
function renderPurchase(c){let inv=nextInvoice('compra');c.innerHTML=`<div class="title">COMPRAS / FACTURA DE COMPRA</div><div class="sub">Compra de productos, proveedor, lote y vencimiento de un mes. Condiciones: contado, 8 o 15 días.</div><div class="card"><div class="form"><div class="field"><label>N° factura</label><input id="pinv" type="number" min="1" step="1" value="${inv}"></div><div class="field"><label>Proveedor</label><select id="pven">${providerOpts()}</select></div><div class="field"><label>Condición</label>${creditSelect('pcond2')}</div><div class="field"><label>Fecha factura</label><input id="pdate" type="date" value="${iso(new Date())}"></div><div class="field"><label>Vencimiento crédito</label><input id="pcreditvenc" type="text" readonly></div><div class="field"><label>Producto</label><select id="pprod">${productOpts()}</select></div><div class="field"><label>Cantidad</label><input id="pqty" type="number" min="1" value="1"></div><div class="field"><label>Costo unitario</label><input id="pcost" type="number" min="0"></div><div class="field"><label>Vencimiento del lote</label><input id="plotvenc" type="text" readonly></div><div class="field actions" style="align-items:end"><button class="btn" onclick="addPurchaseItem()" type="button">+ Agregar producto</button></div></div><div id="purchasecart"></div><div class="actions"><button class="btn" onclick="savePurchase()">Registrar compra N° ${inv}</button><button class="btn alt" onclick="purchaseCart=[];drawPurchaseCart()">Limpiar</button></div></div>`;const refreshPurchaseDates=()=>{let d=new Date(document.getElementById('pdate').value+'T12:00:00');let cond=num(document.getElementById('pcond2').value);let cv=new Date(d);cv.setDate(cv.getDate()+cond);document.getElementById('pcreditvenc').value=date(cv);let lv=new Date(d);lv.setMonth(lv.getMonth()+1);document.getElementById('plotvenc').value=date(lv);drawPurchaseCart()};document.getElementById('pinv').oninput=()=>{let n=num(document.getElementById('pinv').value);document.querySelectorAll('#compras .actions .btn')[0]?.replaceChildren(document.createTextNode('Registrar compra N° '+(n||'')))};document.getElementById('pdate').onchange=refreshPurchaseDates;document.getElementById('pcond2').onchange=refreshPurchaseDates;document.getElementById('pprod').onchange=()=>{let p=productList().find(x=>x.code===pprod.value);pcost.value=p?p.cost:0;refreshPurchaseDates()};pprod.dispatchEvent(new Event('change'));refreshPurchaseDates()}
function addPurchaseItem(){let p=productList().find(x=>x.code===pprod.value),q=num(pqty.value),cost=num(pcost.value);if(!p||q<1)return toast('Seleccione producto y cantidad');purchaseCart.push({code:p.code,name:p.name,qty:q,cost,total:q*cost});drawPurchaseCart()}
function drawPurchaseCart(){let el=document.getElementById('purchasecart');if(!el)return;let total=purchaseCart.reduce((s,x)=>s+x.total,0);let lv=new Date(document.getElementById('pdate').value+'T12:00:00');lv.setMonth(lv.getMonth()+1);let loteVenc=date(lv);el.innerHTML=`<h3>Detalle de compra</h3>${purchaseCart.length?`<div class="tablewrap"><table class="tbl"><tr><th>Código</th><th>Producto</th><th>Cantidad</th><th>Costo</th><th>Vencimiento lote</th><th>Total</th><th></th></tr>${purchaseCart.map((x,i)=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.cost)}</td><td><b>${loteVenc}</b></td><td>${money(x.total)}</td><td><button class="btn danger" onclick="purchaseCart.splice(${i},1);drawPurchaseCart()">Eliminar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No hay productos agregados.</div>'}<div class="card" style="margin-top:10px"><b>Total compra: ${money(total)}</b><br><span>Vencimiento del lote: <b>${loteVenc}</b></span></div>`}
function purchasePortfolioHeaderIndex(){
  const rs=DB['FACTURAS & ABONOS COMPRA']||[];
  return rs.findIndex(r=>Array.isArray(r)&&r.some(v=>String(v??'').trim().toUpperCase()==='N_FACTURA'));
}
function purchasePortfolioFind(invoice){
  const rs=DB['FACTURAS & ABONOS COMPRA']||[];
  return rs.findIndex((r,i)=>i>purchasePortfolioHeaderIndex() && num(r?.[2])===num(invoice));
}
function upsertPurchasePortfolio({id,prov,invoice,cond,d,total,venc}){
  const name='FACTURAS & ABONOS COMPRA';
  if(!DB[name]) DB[name]=[];
  const rs=DB[name];
  const header=purchasePortfolioHeaderIndex();
  const row=[id,prov,invoice,cond===0?'CONTADO':`${cond} DIAS`,iso(d),total,iso(venc),cond===0?total:0,cond===0?0:total,cond===0?'CANCELADO':(new Date()>venc?'VENCIDA':'PENDIENTE'),cond===0?'-':cond,''];
  const existing=purchasePortfolioFind(invoice);
  if(existing>=0) rs[existing]=row;
  else rs.splice(header>=0?header+1:rs.length,0,row);
}
function savePurchase(){
  if(!purchaseCart.length)return toast('Agregue productos');
  const cond=num(pcond2.value),d=new Date(pdate.value+'T12:00:00'),prov=pven.value;
  const total=purchaseCart.reduce((s,x)=>s+x.total,0);
  const venc=new Date(d);venc.setDate(venc.getDate()+cond);
  const invoice=num(document.getElementById('pinv').value);
  if(!Number.isInteger(invoice)||invoice<1)return toast('Ingresa un N° de factura válido.');
  if(purchasePortfolioFind(invoice)>=0)return toast('Ese N° de factura ya existe en compras. Usa otro número.');

  // 1. Guardar cada línea en COMPRAS.
  const ws=DB['COMPRAS'];
  purchaseCart.forEach(x=>ws.push([x.code,iso(d),d.toLocaleString('es-CO',{month:'long'}),d.getFullYear(),x.name,x.cost,x.qty,x.total,invoice]));

  // 2. Crear UNA factura en FACTURAS & ABONOS COMPRA.
  const id=rows('PROVEEDORES').find(r=>String(r[1]??'').trim().toUpperCase()===String(prov??'').trim().toUpperCase())?.[0]||'';
  upsertPurchasePortfolio({id,prov,invoice,cond,d,total,venc});

  // 3. Actualizar FACTURA COMPRA con el mismo N° y todos sus productos.
  updateInvoiceSheet('compra',invoice,d,venc,prov,total,cond,purchaseCart);

  // 4. Crear los lotes vinculados a la factura.
  const lot=DB['LOTES'];
  purchaseCart.forEach(x=>{
    let v=new Date(d); v.setMonth(v.getMonth()+1);
    let n=lot.slice(1).reduce((m,r)=>Math.max(m,num(r[0])),0)+1;
    lot.push([n,x.code,x.name,invoice,iso(d),x.qty,iso(v),Math.ceil((v-d)/86400000),'VIGENTE',x.qty]);
  });

  // 5. RECONSTRUIR INVENTARIO desde COMPRAS y VENTAS.
  normalizeInventory();
  rebuildCashFlow();
  save();
  purchaseCart=[];
  toast('Compra registrada en COMPRAS + INVENTARIO + LOTES + FACTURA COMPRA + CARTERA');
  show('compras');
}
function expenseRows(){
  const rs=rows('GASTOS')||[];
  // Formato actual: [CONCEPTO, FECHA, VALOR]
  if(rs.length && String(rs[0]?.[0]??'').toUpperCase()==='CONCEPTO'){
    return rs.slice(1).filter(r=>r&&String(r[0]??'').trim());
  }
  // Compatibilidad con la estructura antigua del Excel:
  // fila 3 contiene CONCEPTO/FECHA/VALOR y los conceptos de catálogo vienen después.
  return rs.slice(3).filter(r=>r&&String(r[2]??'').trim()).map(r=>[r[2],r[3],r[4]]);
}
function renderExpense(c){
  const base=rows('GASTOS').slice(3).map(r=>String(r?.[0]??'').trim()).filter(Boolean);
  const opts=[...new Set(base)].map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  const data=expenseRows();

function addExpense(e){
  e.preventDefault();
  const sel=document.getElementById('gcon');
  const concept=sel.value==='__OTRO__'?String(document.getElementById('gconOther').value||'').trim():String(sel.value||'').trim();

  if(!fecha)return alert('Selecciona la fecha del gasto.');
  if(valor<=0)return alert('Ingresa un valor de gasto mayor que 0.');

  // Normalizamos GASTOS a una tabla real: CONCEPTO | FECHA | VALOR.
  const existing=expenseRows();
  DB['GASTOS']=[['CONCEPTO','FECHA','VALOR'],...existing,[concept,fecha,valor]];

  rebuildCashFlow();
  save();
  toast(`Gasto registrado: ${money(valor)}`);
  show('gastos');
}
function rebuildCashFlow(){
  const months=new Map();

  function ensureMonth(value){
    if(!value)return null;
    const raw=String(value).slice(0,10);
    const dt=new Date(raw+'T00:00:00');
    if(isNaN(dt))return null;
    const y=dt.getFullYear(),m=dt.getMonth()+1,key=`${y}-${String(m).padStart(2,'0')}`;
    if(!months.has(key))months.set(key,{y,m,text:dt.toLocaleString('es-CO',{month:'long'}),in:0,pc:0,g:0});
    return months.get(key);
  }

  // GASTOS
  expenseRows().forEach(r=>{
    const x=ensureMonth(r[1]),v=num(r[2]);
    if(x&&v>0)x.g+=v;
  });

  // FACTURAS DE VENTA: solo CONTADO entra inmediatamente a caja.
  // Las ventas a crédito entran a caja únicamente mediante ABONOS.
  const fv=DB['FACTURAS & ABONOS VENTAS']||[];
  const hv=portfolioHeaderRow('FACTURAS & ABONOS VENTAS');
  fv.slice(hv+1).forEach(r=>{
    if(!Array.isArray(r)||r[2]==null||r[2]==='')return;
    const cond=String(r[3]??'').trim().toUpperCase();
    if(cond==='CONTADO'){
      const x=ensureMonth(r[4]),v=num(r[5]);
      if(x&&v>0)x.in+=v;
    }
  });

  // FACTURAS DE COMPRA: solo CONTADO sale inmediatamente de caja.
  // Las compras a crédito salen mediante ABONOS A PROVEEDOR.
  const fc=DB['FACTURAS & ABONOS COMPRA']||[];
  const hc=portfolioHeaderRow('FACTURAS & ABONOS COMPRA');
  fc.slice(hc+1).forEach(r=>{
    if(!Array.isArray(r)||r[2]==null||r[2]==='')return;
    const cond=String(r[3]??'').trim().toUpperCase();
    if(cond==='CONTADO'){
      const x=ensureMonth(r[4]),v=num(r[5]);
      if(x&&v>0)x.pc+=v;
    }
  });

  // ABONOS: en estas hojas se guardan en columnas 13=FECHA, 14=FACTURA, 15=MONTO.
  // Se usan solo las filas que tengan una fecha de abono y un monto positivo.
  function addAbonos(name,entrada){
    const rs=DB[name]||[];
    const h=portfolioHeaderRow(name);
    rs.slice(h+1).forEach(r=>{
      if(!Array.isArray(r))return;
      const fecha=r[13],monto=num(r[15]);
      if(!fecha||monto<=0)return;
      const x=ensureMonth(fecha);
      if(x){
        if(entrada)x.in+=monto;
        else x.pc+=monto;
      }
    });
  }
  addAbonos('FACTURAS & ABONOS VENTAS',true);
  addAbonos('FACTURAS & ABONOS COMPRA',false);

  const data=[['AÑO','MES','MES_TEXTO','ENTRADAS','SALIDAS COMPRAS','SALIDAS GASTOS','FLUJO NETO','SALDO ACUMULADO']];
  let saldo=0;
  [...months.values()].sort((a,b)=>a.y-b.y||a.m-b.m).forEach(x=>{
    const net=x.in-x.pc-x.g;
    saldo+=net;
    data.push([x.y,x.m,x.text,x.in,x.pc,x.g,net,saldo]);
  });
  DB['FLUJO DE CAJA']=data;
}



function businessResultSummary(){
  // VENTAS: total facturado desde FACTURAS & ABONOS VENTAS.
  // COSTO DE LO VENDIDO: costo unitario real de cada línea vendida x cantidad.
  const fv=DB['FACTURAS & ABONOS VENTAS']||[];
  const hf=portfolioHeaderRow('FACTURAS & ABONOS VENTAS');
  const ventas=fv.slice(hf+1).reduce((a,r)=>{
    if(!Array.isArray(r)||r[2]==null||r[2]==='') return a;
    return a+num(r[5]);
  },0);

  const vr=DB['VENTAS']||[];
  const hv=vr.findIndex(r=>Array.isArray(r)&&String(r[0]??'').toUpperCase()==='CODIGO');
  const costo=vr.slice(hv>=0?hv+1:1).reduce((a,r)=>{
    if(!Array.isArray(r)||!r[0]) return a;
    return a+(num(r[6])*num(r[7]));
  },0);

  const gastos=expenseRows().reduce((a,r)=>a+num(r[2]),0);
  return {ventas,costo,utilidad:ventas-costo,gastos,operativa:ventas-costo-gastos};
}

function portfolioSummary(sheet){
  const rs=DB[sheet]||[];
  const h=portfolioHeaderRow(sheet);
  const rowsData=rs.slice(h+1);
  let total=0, saldo=0, pendientes=0, vencidas=0;
  const today=new Date(); today.setHours(0,0,0,0);
  rowsData.forEach(r=>{
    if(!Array.isArray(r)||r[2]==null||r[2]==='') return;
    const importe=num(r[5]), pago=num(r[7]), sal=num(r[8]);
    total+=importe; saldo+=sal;
    if(sal>0){
      pendientes++;
      const venc=r[6];
      if(venc){
        const d=new Date(String(venc).slice(0,10)+'T00:00:00');
        if(!isNaN(d)&&d<today) vencidas++;
      }
    }
  });
  return {total,saldo,pendientes,vencidas};
}

function compactPortfolioTable(t){let name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';let h=rows(name)[portfolioHeaderRow(name)]||[];let rs=portfolioDataRows(name).filter(r=>r[2]!=null&&r[2]!=='');let cols=t==='venta'?['ID_CLIENTE','CLIENTE','N_FACTURA','CONDICION','FECHA _FACTURA','IMPORTE','FECHA_VENCIMIENTO','PAGO','SALDO','ESTADO','DIAS','RANGO']:['ID_PROVEEDOR','PROVEEDOR','N_FACTURA','CONDICION','FECHA _FACTURA','IMPORTE','FECHA_VENCIMIENTO','PAGO','SALDO','ESTADO','DIAS','RANGO'];let idx=cols.map(x=>h.findIndex(y=>String(y??'').trim().toUpperCase()===x));return `<div class="tablewrap cartera-table"><table class="tbl"><thead><tr>${cols.map(x=>`<th>${esc(x.replace('FECHA _FACTURA','FECHA FACTURA'))}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${idx.map((j,k)=>{let v=j>=0?r[j]:'';if(cols[k].includes('FECHA'))v=date(v);if(cols[k]==='IMPORTE'||cols[k]==='PAGO'||cols[k]==='SALDO')v=money(v);return `<td>${esc(v??'')}</td>`}).join('')}</tr>`).join('')||'<tr><td colspan="12" class="empty">No hay facturas registradas.</td></tr>'}</tbody></table></div>`}

function addAbono(e,t){
  e.preventDefault();
  const name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';
  const rs=DB[name]||[];
  const invoice=num(document.getElementById('abfact').value);
  const v=num(document.getElementById('abval').value);
  if(!invoice||v<=0)return toast('Ingresa una factura y un valor de abono válido.');
  const h=portfolioHeaderRow(name);
  const r=rs.find((row,i)=>i>h && num(row?.[2])===invoice);
  if(!r)return toast('Factura no encontrada');
  const saldoActual=Math.max(0,num(r[5])-num(r[7]));
  if(v>saldoActual)return toast(`El abono no puede superar el saldo pendiente de ${money(saldoActual)}.`);
  r[7]=num(r[7])+v;
  r[8]=Math.max(0,num(r[5])-r[7]);
  const venc=new Date(r[6]);
  r[9]=r[8]===0?'CANCELADO':(venc<new Date()?'VENCIDA':'PENDIENTE');
  r[10]=r[8]===0?'-':(r[10]==='-'?Math.max(0,Math.ceil((venc-new Date())/86400000)):r[10]);
  const fechaAbono=iso(new Date());
  const abonoRow=[];
  const width=Math.max(16, ...rs.map(x=>Array.isArray(x)?x.length:0));
  for(let i=0;i<width;i++)abonoRow.push(null);
  abonoRow[13]=fechaAbono;
  abonoRow[14]=invoice;
  abonoRow[15]=v;
  rs.push(abonoRow);
  DB[name]=rs;
  rebuildCashFlow();
  save();
  toast(`Abono registrado el ${date(fechaAbono)}`);
  show(t==='venta'?'carteraventa':'carteracompra');
}

function updateInvoiceSheet(t,invoice,d,venc,party,total,cond,items){
  let name=t==='venta'?'FACTURA VENTA':'FACTURA COMPRA',r=DB[name]||[];
  if(!r.length)return;
  // Fecha de vencimiento de la cartera = vencimiento del crédito (0, 8 o 15 días).
  // Para FACTURA COMPRA además mostramos, por cada producto, el vencimiento del LOTE (1 mes desde la compra).
  for(let i=0;i<r.length;i++){
    if(String(r[i][6]??'')==='Factura No.:')r[i][7]=invoice;
    if(String(r[i][6]??'')==='Fecha:')r[i][7]=iso(d);
    if(String(r[i][6]??'')==='Fecha de vencimiento:')r[i][7]=iso(venc);
    if(String(r[i][6]??'')==='Pago Contado')r[i][8]=cond===0?total:0;
    if(String(r[i][6]??'').trim()==='Pago Crédito')r[i][8]=cond>0?total:0;
    if(String(r[i][6]??'').trim()==='Días Crédito')r[i][8]=cond;
  }
  let infoRow=r.findIndex(x=>String(x[0]??'').toUpperCase()===(t==='venta'?'CLIENTE':'PROVEEDOR'));
  if(infoRow>=0)r[infoRow][1]=party;
  let header=r.findIndex(x=>String(x[0]??'').toUpperCase()==='CÓDIGO'||String(x[0]??'').toUpperCase()==='CODIGO');
  if(header>=0){
    // Conservamos la sección INFORMACIÓN DE PAGO de la plantilla y reemplazamos solo las filas de productos.
    let payStart=r.findIndex((row,idx)=>idx>header && (String(row[7]??'').trim()==='Total Factura'||String(row[7]??'').trim()==='INFORMACIÓN DE PAGO'));
    let removeCount=payStart>=0?payStart-header-1:Math.max(0,r.length-(header+1));
    if(removeCount>0)r.splice(header+1,removeCount);
    let itemRows=items.map(x=>{
      if(t==='compra'){
        let loteVenc=new Date(d);
        loteVenc.setMonth(loteVenc.getMonth()+1);
        return [x.code,x.name,x.qty,x.cost,null,x.total,iso(loteVenc),null,null];
      }
      return [x.code,x.name,x.qty,x.price,null,x.total,null,null,null];
    });
    r.splice(header+1,0,...itemRows);
  }
  save();
}

  const body=lines.map(r=>{
    const lote=t==='compra'?(()=>{let d=new Date(r[1]);d.setMonth(d.getMonth()+1);return date(d)})():'';
    return t==='venta'?`<tr><td>${esc(r[0])}</td><td>${esc(r[4])}</td><td>${num(r[7])}</td><td>${money(r[5])}</td><td>${money(r[8])}</td></tr>`:`<tr><td>${esc(r[0])}</td><td>${esc(r[4])}</td><td>${num(r[6])}</td><td>${money(r[5])}</td><td>${lote}</td><td>${money(r[7])}</td></tr>`;
  }).join('');
  c.innerHTML=`<div class="title">${t==='venta'?'FACTURA DE VENTA':'FACTURA DE COMPRA'}</div>
  <div class="sub">Factura vinculada directamente con ${t==='venta'?'VENTAS':'COMPRAS'} y ${t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA'}.</div>
  <div class="card"><div class="form"><div class="field"><label>Seleccionar factura</label><select onchange="showLinkedInvoice('${t}',this.value)">${invoiceOptions(t,invoice)}</select></div><div class="field"><label>N° factura</label><input value="${esc(invoice)}" readonly></div><div class="field"><label>${t==='venta'?'Cliente':'Proveedor'}</label><input value="${esc(party)}" readonly></div><div class="field"><label>Condición</label><input value="${esc(cond)}" readonly></div><div class="field"><label>Fecha</label><input value="${esc(dateFactura)}" readonly></div><div class="field"><label>Fecha de vencimiento crédito</label><input value="${esc(venc)}" readonly></div></div></div>
  <div class="card" style="margin-top:12px"><h3>Detalle de la factura N° ${esc(invoice)}</h3><div class="tablewrap"><table class="tbl"><thead><tr>${headersLine.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body||'<tr><td colspan="6" class="empty">No hay productos asociados a esta factura.</td></tr>'}</tbody></table></div>
  <div class="card" style="margin-top:10px"><b>Total factura: ${money(total)}</b><br>Pago: ${money(pago)}<br>Saldo: ${money(saldo)}<br>Estado: <b>${esc(pr[9]||'')}</b></div></div>`;
}
function showLinkedInvoice(t,invoice){let c=document.getElementById('content');renderLinkedInvoice(c,t,num(invoice))}
function renderInvoice(c,t){
  const name=t==='venta'?'FACTURAS & ABONOS VENTAS':'FACTURAS & ABONOS COMPRA';
  const list=rows(name).slice(1).filter(r=>r&&r[2]!=null&&r[2]!=='');
  const latest=list.reduce((m,r)=>Math.max(m,num(r[2])),0);
  if(!latest){c.innerHTML=`<div class="title">${t==='venta'?'FACTURA VENTA':'FACTURA COMPRA'}</div><div class="empty">Todavía no hay facturas registradas.</div>`;return}
  renderLinkedInvoice(c,t,latest);
}

async function importExcel(file){if(!file)return;try{if(!window.XLSX){await loadXLSX()}let buf=await file.arrayBuffer();let wb=XLSX.read(buf,{type:'array',cellDates:true});let n={};wb.SheetNames.forEach(s=>{n[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:true,defval:null})});DB=n;save();toast('Excel importado');show('menu')}catch(e){alert('No se pudo importar el Excel: '+e.message)}}
function loadXLSX(){return new Promise((res,rej)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function resetTestData(){
  const ok=confirm('¿Seguro que quieres comenzar de nuevo?\n\nSe borrarán los datos de prueba de compras, ventas, facturas, abonos, lotes, gastos y flujo de caja.\n\nSe conservarán productos, clientes, proveedores y la estructura del sistema.');
  if(!ok)return;

  // IMPORTANTE: no dejamos solo la primera fila de cada hoja.
  // Las hojas COMPRAS/VENTAS necesitan sus encabezados para que
  // la sincronización pueda leer las nuevas operaciones, y las hojas
  // de cartera necesitan conservar su fila N_FACTURA + AGING.
  const copyRows=n=>{
    const base=INITIAL[n]||[];
    if(!base.length)return [];
    if(n==='COMPRAS'||n==='VENTAS') return base.slice(0,4).map(r=>Array.isArray(r)?[...r]:r);
    if(n==='LOTES') return base.slice(0,2).map(r=>Array.isArray(r)?[...r]:r);
    if(n==='FACTURA COMPRA'||n==='FACTURA VENTA') return base.map(r=>Array.isArray(r)?[...r]:r);
    if(n==='FACTURAS & ABONOS COMPRA'||n==='FACTURAS & ABONOS VENTAS'){
      const out=base.slice(0,3).map(r=>Array.isArray(r)?[...r]:r);
      // Conserva las tablas auxiliares de ABONOS/AGING, pero elimina
      // cualquier factura/abono de prueba de las columnas principales.
      for(let i=3;i<base.length;i++){
        const r=Array.isArray(base[i])?[...base[i]]:[];
        // Borra también ABONOS (FECHA/FACTURA/MONTO) para comenzar desde cero.
        for(let j=0;j<16;j++) r[j]=null;
        out.push(r);
      }
      return out;
    }
    if(n==='GASTOS') return (base.slice(0,3)||[]).map(r=>Array.isArray(r)?[...r]:r);
    if(n==='FLUJO DE CAJA') return base.slice(0,2).map(r=>Array.isArray(r)?[...r]:r);
    return base.map(r=>Array.isArray(r)?[...r]:r);
  };

  const tx=['COMPRAS','VENTAS','FACTURA VENTA','FACTURA COMPRA','FACTURAS & ABONOS VENTAS','FACTURAS & ABONOS COMPRA','LOTES','GASTOS','FLUJO DE CAJA'];
  tx.forEach(n=>DB[n]=copyRows(n));

  // Reiniciar inventario conservando los productos configurados.
  const prod=DB['BASE DE DATOS DE PRODUCTOS']||[];
  const phIndex=prod.findIndex(r=>Array.isArray(r)&&r.some(v=>String(v).toUpperCase().includes('CODIGO')));
  const ph=phIndex>=0?prod[phIndex]:[];
  const ih=(INITIAL['INVENTARIO']||[])[3]||['CODIGO','NOMBRE DEL PRODUCTO','COMPRAS','VENTAS','STOCK','COSTO UNITARIO','VALOR DEL INVENTARIO'];
  const codeIdx=ph.findIndex(v=>String(v).toUpperCase().includes('CODIGO'));
  const nameIdx=ph.findIndex(v=>String(v).toUpperCase().includes('NOMBRE'));
  const invRows=[Array.isArray((INITIAL['INVENTARIO']||[])[0])?[...(INITIAL['INVENTARIO']||[])[0]]:['INVENTARIO'],[null,null,null,null,null,null,null,'TOTAL INVENTARIO'],[null,null,null,null,null,null,null,null],Array.isArray(ih)?[...ih]:ih];
  prod.slice(phIndex+1).forEach(r=>{
    if(!Array.isArray(r))return;
    const code=codeIdx>=0?r[codeIdx]:r[0];
    const name=nameIdx>=0?r[nameIdx]:r[1];
    if(code && name) invRows.push([code,name,0,0,0,0,0]);
  });
  DB['INVENTARIO']=invRows;

  // Reconstrucción final: debe quedar lista para que la primera compra
  // aparezca inmediatamente en INVENTARIO y en FACTURAS & ABONOS COMPRA.
  ensureInvoiceLinks();
  normalizeInventory();
  save();
  toast('Sistema reiniciado correctamente: estructura conservada y movimientos en cero');
  show('menu');
}
